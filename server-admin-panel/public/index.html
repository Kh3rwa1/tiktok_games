<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Kisku</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* KISKU ADMIN PANEL - NEO-BRUTALISM DESIGN */

    /* ==================== CSS VARIABLES ==================== */
    :root {
      /* Neo-Brutalism Color Palette */
      --primary: #FF6B6B;
      --primary-glow: rgba(255, 107, 107, 0.3);
      --secondary: #4ECDC4;
      --secondary-glow: rgba(78, 205, 196, 0.3);
      --accent: #FFDE59;
      --accent-glow: rgba(255, 222, 89, 0.3);
      --success: #A8E6CF;
      --danger: #FF6B6B;
      --warning: #FFDE59;
      --info: #74B9FF;

      /* Light Theme - Neo-Brutalism */
      --bg-primary: #FFFEF0;
      --bg-secondary: #FFFFFF;
      --bg-tertiary: #F5F5DC;
      --bg-card: #FFFFFF;
      --bg-hover: #F0F0E0;

      /* Text */
      --text-primary: #000000;
      --text-secondary: #333333;
      --text-muted: #666666;

      /* Borders - Thick and Bold */
      --border-color: #000000;
      --border-glow: #000000;

      /* Layout */
      --sidebar-width: 280px;
      --header-height: 70px;
      --border-radius: 0px;
      --border-radius-lg: 0px;

      /* Shadows - Harsh, No Blur */
      --shadow-sm: 4px 4px 0px #000000;
      --shadow-md: 6px 6px 0px #000000;
      --shadow-lg: 8px 8px 0px #000000;
      --shadow-glow: 4px 4px 0px #000000;

      /* Transitions */
      --transition-fast: 0.15s ease;
      --transition-normal: 0.3s ease;
      --transition-slow: 0.5s ease;
      --transition-bounce: 0.3s ease;
    }

    /* ==================== RESET & BASE ==================== */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-primary);
      min-height: 100vh;
      color: var(--text-primary);
      overflow-x: hidden;
    }

    /* ==================== KEYFRAME ANIMATIONS ==================== */
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInLeft {
      from { opacity: 0; transform: translateX(-20px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @keyframes fadeInRight {
      from { opacity: 0; transform: translateX(20px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @keyframes scaleIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes slideInRight {
      from { transform: translateX(100%); }
      to { transform: translateX(0); }
    }

    @keyframes slideOutRight {
      from { transform: translateX(0); }
      to { transform: translateX(120%); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    @keyframes glow {
      0%, 100% { box-shadow: 0 0 20px var(--primary-glow); }
      50% { box-shadow: 0 0 40px var(--primary-glow), 0 0 60px var(--primary-glow); }
    }

    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes countUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes ripple {
      to { transform: scale(4); opacity: 0; }
    }

    @keyframes borderGlow {
      0%, 100% { border-color: var(--primary); box-shadow: 0 0 10px var(--primary-glow); }
      50% { border-color: var(--secondary); box-shadow: 0 0 20px var(--secondary-glow); }
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes typewriter {
      from { width: 0; }
      to { width: 100%; }
    }

    /* ==================== PARTICLE BACKGROUND ==================== */
    .particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: var(--primary);
      border-radius: 50%;
      animation: float 15s infinite;
      opacity: 0.3;
    }

    .particle:nth-child(1) { left: 10%; animation-delay: 0s; animation-duration: 20s; }
    .particle:nth-child(2) { left: 20%; animation-delay: 2s; animation-duration: 18s; background: var(--secondary); }
    .particle:nth-child(3) { left: 30%; animation-delay: 4s; animation-duration: 22s; }
    .particle:nth-child(4) { left: 40%; animation-delay: 1s; animation-duration: 19s; background: var(--accent); }
    .particle:nth-child(5) { left: 50%; animation-delay: 3s; animation-duration: 21s; }
    .particle:nth-child(6) { left: 60%; animation-delay: 5s; animation-duration: 17s; background: var(--secondary); }
    .particle:nth-child(7) { left: 70%; animation-delay: 2s; animation-duration: 23s; }
    .particle:nth-child(8) { left: 80%; animation-delay: 4s; animation-duration: 16s; background: var(--primary); }
    .particle:nth-child(9) { left: 90%; animation-delay: 1s; animation-duration: 20s; }
    .particle:nth-child(10) { left: 95%; animation-delay: 3s; animation-duration: 18s; background: var(--accent); }

    /* ==================== LOGIN SCREEN ==================== */
    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--bg-primary) 0%, #1a0a1f 50%, var(--bg-primary) 100%);
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    .login-container::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, var(--primary-glow) 0%, transparent 70%);
      transform: translate(-50%, -50%);
      animation: pulse 4s ease-in-out infinite;
    }

    .login-box {
      background: var(--bg-card);
      border: 4px solid #000000;
      border-radius: 0;
      padding: 48px;
      width: 100%;
      max-width: 420px;
      position: relative;
      animation: scaleIn 0.5s ease-out;
      box-shadow: 8px 8px 0px #000000;
    }

    .login-box h1 {
      text-align: center;
      font-size: 32px;
      font-weight: 900;
      margin-bottom: 8px;
      color: #000000;
    }

    .login-box p {
      text-align: center;
      color: var(--text-secondary);
      margin-bottom: 36px;
      font-size: 14px;
      font-weight: 600;
    }

    /* ==================== FORM ELEMENTS ==================== */
    .form-group {
      margin-bottom: 24px;
      animation: fadeInUp 0.5s ease-out;
      animation-fill-mode: both;
    }

    .form-group:nth-child(1) { animation-delay: 0.1s; }
    .form-group:nth-child(2) { animation-delay: 0.2s; }
    .form-group:nth-child(3) { animation-delay: 0.3s; }

    .form-group label {
      display: block;
      margin-bottom: 10px;
      font-weight: 600;
      color: var(--text-secondary);
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 14px 18px;
      border: 3px solid #000000;
      border-radius: 0;
      background: var(--bg-secondary);
      font-size: 14px;
      font-family: inherit;
      color: var(--text-primary);
      transition: all var(--transition-normal);
      box-shadow: 3px 3px 0px #000000;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      outline: none;
      background: var(--accent);
      transform: translate(-2px, -2px);
      box-shadow: 5px 5px 0px #000000;
    }

    .form-group input::placeholder {
      color: var(--text-muted);
    }

    /* File Upload */
    .file-upload-area {
      border: 2px dashed var(--border-color);
      background: var(--bg-secondary);
      padding: 32px;
      text-align: center;
      cursor: pointer;
      transition: all var(--transition-normal);
      border-radius: var(--border-radius);
    }

    .file-upload-area:hover {
      border-color: var(--primary);
      background: rgba(255, 0, 80, 0.1);
      transform: translateY(-2px);
    }

    .file-upload-area.has-file {
      border-color: var(--success);
      background: rgba(0, 255, 102, 0.1);
    }

    .file-upload-area i {
      font-size: 32px;
      margin-bottom: 12px;
      display: block;
      color: var(--primary);
    }

    /* ==================== BUTTONS - NEO-BRUTALISM ==================== */
    .btn {
      padding: 14px 28px;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
      transition: all var(--transition-normal);
      border: 3px solid #000000;
      border-radius: 0;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-family: inherit;
      position: relative;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }

    .btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0px #000000;
    }

    .btn:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px #000000;
    }

    .btn-primary {
      background: var(--primary);
      color: #000000;
    }

    .btn-secondary {
      background: var(--bg-tertiary);
      color: var(--text-primary);
    }

    .btn-success {
      background: var(--success);
      color: #000000;
    }

    .btn-danger {
      background: var(--danger);
      color: #000000;
    }

    .btn-info {
      background: var(--info);
      color: #000000;
    }

    .btn-outline {
      background: transparent;
      color: var(--text-primary);
    }

    .btn-outline:hover {
      background: var(--primary);
    }

    .btn-sm {
      padding: 10px 18px;
      font-size: 12px;
    }

    .btn-block {
      width: 100%;
      justify-content: center;
    }

    /* ==================== APP CONTAINER ==================== */
    .app-container {
      display: flex;
      min-height: 100vh;
      position: relative;
      z-index: 1;
    }

    /* ==================== SIDEBAR - NEO-BRUTALISM ==================== */
    .sidebar {
      width: var(--sidebar-width);
      background: var(--accent);
      position: fixed;
      height: 100vh;
      overflow-y: auto;
      z-index: 1000;
      transition: transform var(--transition-normal);
      border-right: 4px solid #000000;
      animation: fadeInLeft 0.5s ease-out;
    }

    .sidebar-header {
      padding: 24px;
      border-bottom: 4px solid #000000;
      background: var(--primary);
    }

    .sidebar-header h2 {
      font-size: 24px;
      font-weight: 900;
      color: #000000;
    }

    .sidebar-header span {
      font-size: 10px;
      color: #000000;
      font-weight: 800;
      background: #FFFFFF;
      padding: 4px 8px;
      border: 2px solid #000000;
      display: inline-block;
      margin-top: 8px;
    }

    .sidebar-nav { padding: 16px 0; }

    .nav-section {
      padding: 12px 24px;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--text-muted);
      margin-top: 16px;
      font-weight: 700;
    }

    .nav-item {
      display: flex;
      align-items: center;
      padding: 14px 24px;
      color: var(--text-secondary);
      text-decoration: none;
      transition: all var(--transition-normal);
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      border-left: 3px solid transparent;
      position: relative;
      overflow: hidden;
    }

    .nav-item::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      width: 0;
      height: 100%;
      background: linear-gradient(90deg, var(--primary-glow), transparent);
      transition: width var(--transition-normal);
    }

    .nav-item:hover::before {
      width: 100%;
    }

    .nav-item:hover {
      color: var(--text-primary);
      border-left-color: var(--primary);
    }

    .nav-item.active {
      color: var(--primary);
      background: rgba(255, 0, 80, 0.1);
      border-left-color: var(--primary);
    }

    .nav-item i {
      width: 24px;
      margin-right: 14px;
      font-size: 16px;
      position: relative;
      z-index: 1;
    }

    .nav-item span {
      position: relative;
      z-index: 1;
    }

    /* ==================== MAIN CONTENT ==================== */
    .main-content {
      flex: 1;
      margin-left: var(--sidebar-width);
      min-height: 100vh;
      background: var(--bg-primary);
    }

    /* ==================== HEADER ==================== */
    .header {
      height: var(--header-height);
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(10px);
      animation: fadeInDown 0.5s ease-out;
    }

    .header h1 {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      padding: 8px 16px;
      border-radius: var(--border-radius);
      background: var(--bg-tertiary);
      transition: all var(--transition-normal);
    }

    .user-info:hover {
      background: var(--bg-hover);
      transform: translateY(-2px);
    }

    .user-avatar {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      font-size: 14px;
    }

    .user-info span {
      font-weight: 600;
      font-size: 13px;
    }

    /* ==================== CONTENT AREA ==================== */
    .content {
      padding: 28px;
      animation: fadeIn 0.5s ease-out;
    }

    /* ==================== CARDS - NEO-BRUTALISM ==================== */
    .card {
      background: var(--bg-card);
      border: 3px solid #000000;
      border-radius: 0;
      margin-bottom: 28px;
      box-shadow: var(--shadow-md);
      transition: all var(--transition-normal);
      animation: fadeInUp 0.5s ease-out;
      overflow: hidden;
    }

    .card:hover {
      transform: translate(-2px, -2px);
      box-shadow: 8px 8px 0px #000000;
    }

    .card-header {
      padding: 20px 24px;
      border-bottom: 3px solid #000000;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--accent);
    }

    .card-header h3 {
      font-size: 16px;
      font-weight: 800;
      color: #000000;
    }

    .card-body { padding: 24px; }

    /* ==================== STATS GRID ==================== */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 24px;
      margin-bottom: 28px;
    }

    .stat-card {
      background: var(--bg-card);
      border: 3px solid #000000;
      border-radius: 0;
      padding: 24px;
      position: relative;
      transition: all var(--transition-normal);
      overflow: hidden;
      animation: fadeInUp 0.5s ease-out;
      animation-fill-mode: both;
      box-shadow: var(--shadow-sm);
    }

    .stat-card:nth-child(1) { animation-delay: 0.1s; background: var(--primary); }
    .stat-card:nth-child(2) { animation-delay: 0.2s; background: var(--secondary); }
    .stat-card:nth-child(3) { animation-delay: 0.3s; background: var(--accent); }
    .stat-card:nth-child(4) { animation-delay: 0.4s; background: var(--info); }

    .stat-card:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0px #000000;
    }

    .stat-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .stat-card-icon {
      width: 52px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      border-radius: var(--border-radius);
      transition: all var(--transition-normal);
    }

    .stat-card:hover .stat-card-icon {
      transform: scale(1.1) rotate(5deg);
    }

    .stat-card-icon.primary { background: rgba(255, 0, 80, 0.2); color: var(--primary); }
    .stat-card-icon.success { background: rgba(0, 255, 102, 0.2); color: var(--success); }
    .stat-card-icon.warning { background: rgba(255, 229, 0, 0.2); color: var(--accent); }
    .stat-card-icon.info { background: rgba(0, 212, 255, 0.2); color: var(--info); }

    .stat-card h4 {
      font-size: 12px;
      color: #000000;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .stat-card .value {
      font-size: 36px;
      font-weight: 900;
      color: #000000;
      animation: countUp 0.8s ease-out;
    }

    /* ==================== TABLES ==================== */
    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 14px 18px;
      text-align: left;
      border-bottom: 1px solid var(--border-color);
    }

    th {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-secondary);
      font-weight: 700;
      background: var(--bg-tertiary);
    }

    td {
      font-size: 13px;
      color: var(--text-primary);
    }

    tr {
      transition: all var(--transition-fast);
    }

    tr:hover {
      background: var(--bg-hover);
    }

    tbody tr {
      animation: fadeInUp 0.3s ease-out;
      animation-fill-mode: both;
    }

    tbody tr:nth-child(1) { animation-delay: 0.05s; }
    tbody tr:nth-child(2) { animation-delay: 0.1s; }
    tbody tr:nth-child(3) { animation-delay: 0.15s; }
    tbody tr:nth-child(4) { animation-delay: 0.2s; }
    tbody tr:nth-child(5) { animation-delay: 0.25s; }

    /* ==================== BADGES ==================== */
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 6px 12px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-radius: 20px;
      transition: all var(--transition-fast);
    }

    .badge:hover {
      transform: scale(1.05);
    }

    .badge-success { background: rgba(0, 255, 102, 0.2); color: var(--success); }
    .badge-danger { background: rgba(255, 51, 51, 0.2); color: var(--danger); }
    .badge-warning { background: rgba(255, 229, 0, 0.2); color: var(--accent); }
    .badge-info { background: rgba(0, 212, 255, 0.2); color: var(--info); }
    .badge-primary { background: rgba(255, 0, 80, 0.2); color: var(--primary); }

    /* ==================== SEARCH BAR ==================== */
    .search-bar {
      display: flex;
      gap: 16px;
      margin-bottom: 24px;
    }

    .search-input {
      flex: 1;
      position: relative;
    }

    .search-input input {
      width: 100%;
      padding: 12px 18px 12px 48px;
      border: 1px solid var(--border-color);
      border-radius: var(--border-radius);
      background: var(--bg-secondary);
      font-size: 14px;
      font-family: inherit;
      color: var(--text-primary);
      transition: all var(--transition-normal);
    }

    .search-input input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-glow);
    }

    .search-input i {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 16px;
      transition: color var(--transition-fast);
    }

    .search-input input:focus + i,
    .search-input:hover i {
      color: var(--primary);
    }

    /* ==================== TOAST NOTIFICATIONS ==================== */
    .toast-container {
      position: fixed;
      top: 24px;
      right: 24px;
      z-index: 3000;
    }

    .toast {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--border-radius);
      padding: 16px 20px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 14px;
      animation: slideInRight 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      min-width: 320px;
      font-weight: 500;
      box-shadow: var(--shadow-lg);
      backdrop-filter: blur(10px);
    }

    .toast.exit {
      animation: slideOutRight 0.3s ease-out forwards;
    }

    .toast.success {
      border-left: 4px solid var(--success);
    }

    .toast.success i { color: var(--success); }

    .toast.error {
      border-left: 4px solid var(--danger);
    }

    .toast.error i { color: var(--danger); }

    .toast.info {
      border-left: 4px solid var(--info);
    }

    .toast.info i { color: var(--info); }

    /* ==================== TABS ==================== */
    .tabs {
      display: flex;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 28px;
      background: var(--bg-secondary);
      border-radius: var(--border-radius) var(--border-radius) 0 0;
      overflow: hidden;
    }

    .tab {
      padding: 16px 24px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      cursor: pointer;
      border: none;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: all var(--transition-normal);
      background: transparent;
      position: relative;
    }

    .tab::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      width: 0;
      height: 2px;
      background: var(--primary);
      transition: all var(--transition-normal);
      transform: translateX(-50%);
    }

    .tab:hover {
      color: var(--text-primary);
      background: var(--bg-hover);
    }

    .tab.active {
      color: var(--primary);
    }

    .tab.active::after {
      width: 100%;
    }

    .tab-content { display: none; }
    .tab-content.active {
      display: block;
      animation: fadeIn 0.3s ease-out;
    }

    /* ==================== SETTINGS ==================== */
    .settings-section { margin-bottom: 36px; }

    .settings-section h4 {
      font-size: 14px;
      color: var(--text-primary);
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
      font-weight: 700;
    }

    .settings-group {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
    }

    .setting-item {
      background: var(--bg-secondary);
      padding: 20px;
      border-radius: var(--border-radius);
      border: 1px solid var(--border-color);
      transition: all var(--transition-normal);
    }

    .setting-item:hover {
      border-color: var(--primary);
      box-shadow: 0 0 15px var(--primary-glow);
    }

    .setting-item label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .setting-item .help-text {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 8px;
    }

    /* ==================== TOGGLE SWITCH ==================== */
    .toggle {
      position: relative;
      display: inline-block;
      width: 56px;
      height: 30px;
    }

    .toggle input { opacity: 0; width: 0; height: 0; }

    .toggle-slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--bg-tertiary);
      border-radius: 30px;
      transition: all var(--transition-normal);
    }

    .toggle-slider:before {
      position: absolute;
      content: "";
      height: 22px;
      width: 22px;
      left: 4px;
      bottom: 4px;
      background: var(--text-primary);
      border-radius: 50%;
      transition: all var(--transition-bounce);
    }

    .toggle input:checked + .toggle-slider {
      background: var(--primary);
      box-shadow: 0 0 15px var(--primary-glow);
    }

    .toggle input:checked + .toggle-slider:before {
      transform: translateX(26px);
    }

    /* ==================== ACTION BUTTONS ==================== */
    .action-btns { display: flex; gap: 8px; }

    .action-btn {
      padding: 8px 12px;
      border: none;
      border-radius: var(--border-radius);
      cursor: pointer;
      font-size: 12px;
      transition: all var(--transition-normal);
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .action-btn:hover {
      transform: translateY(-2px) scale(1.05);
    }

    .action-btn:active {
      transform: translateY(0) scale(0.95);
    }

    .action-btn.edit {
      background: rgba(0, 212, 255, 0.2);
      color: var(--info);
    }

    .action-btn.edit:hover {
      background: rgba(0, 212, 255, 0.3);
      box-shadow: 0 0 15px var(--secondary-glow);
    }

    .action-btn.delete {
      background: rgba(255, 51, 51, 0.2);
      color: var(--danger);
    }

    .action-btn.delete:hover {
      background: rgba(255, 51, 51, 0.3);
      box-shadow: 0 0 15px rgba(255, 51, 51, 0.4);
    }

    .action-btn.toggle {
      background: rgba(255, 229, 0, 0.2);
      color: var(--accent);
    }

    .action-btn.toggle:hover {
      background: rgba(255, 229, 0, 0.3);
      box-shadow: 0 0 15px var(--accent-glow);
    }

    /* ==================== LOADING STATE ==================== */
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px;
      flex-direction: column;
      gap: 20px;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 3px solid var(--border-color);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .loading-text {
      color: var(--text-secondary);
      font-size: 14px;
      animation: pulse 2s ease-in-out infinite;
    }

    /* ==================== MODAL ==================== */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      padding: 20px;
      animation: fadeIn 0.3s ease-out;
      backdrop-filter: blur(5px);
    }

    .modal {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--border-radius-lg);
      width: 100%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: var(--shadow-lg), 0 0 50px var(--primary-glow);
      animation: scaleIn 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    }

    .modal-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border-color);
      background: var(--bg-tertiary);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header h3 {
      font-size: 16px;
      font-weight: 700;
    }

    .modal-close {
      background: var(--bg-secondary);
      color: var(--text-secondary);
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 18px;
      transition: all var(--transition-fast);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-close:hover {
      background: var(--danger);
      color: white;
      transform: rotate(90deg);
    }

    .modal-body { padding: 24px; }

    .modal-footer {
      padding: 16px 24px;
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 12px;
      justify-content: flex-end;
    }

    /* ==================== EMPTY STATE ==================== */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-secondary);
    }

    .empty-state i {
      font-size: 56px;
      margin-bottom: 20px;
      opacity: 0.3;
      animation: float 3s ease-in-out infinite;
    }

    .empty-state p {
      font-size: 14px;
      font-weight: 500;
    }

    /* ==================== GAME/USER ITEMS ==================== */
    .game-thumb {
      width: 48px;
      height: 48px;
      object-fit: cover;
      border-radius: var(--border-radius);
      border: 1px solid var(--border-color);
      transition: all var(--transition-fast);
    }

    tr:hover .game-thumb {
      transform: scale(1.1);
      border-color: var(--primary);
    }

    .table-avatar {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 12px;
    }

    /* ==================== GRID LAYOUTS ==================== */
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 24px;
    }

    /* ==================== CONFIRM DIALOG ==================== */
    .confirm-dialog {
      text-align: center;
      padding: 20px;
    }

    .confirm-dialog i {
      font-size: 48px;
      margin-bottom: 16px;
      color: var(--danger);
      animation: pulse 2s ease-in-out infinite;
    }

    .confirm-dialog p {
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 24px;
      color: var(--text-secondary);
    }

    .confirm-dialog .btn-group {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    /* ==================== RESPONSIVE ==================== */
    @media (max-width: 1024px) {
      .sidebar { transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); }
      .main-content { margin-left: 0; }
      .grid-2 { grid-template-columns: 1fr; }
      .stats-grid { grid-template-columns: 1fr; }
    }

    /* ==================== SCROLLBAR ==================== */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg-secondary); }
    ::-webkit-scrollbar-thumb {
      background: var(--bg-tertiary);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--primary);
    }

    /* ==================== SELECTION ==================== */
    ::selection {
      background: var(--primary);
      color: white;
    }

    /* ==================== PROGRESS BAR ==================== */
    .progress-bar {
      height: 6px;
      background: var(--bg-tertiary);
      border-radius: 3px;
      overflow: hidden;
      margin-top: 8px;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      border-radius: 3px;
      transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
      animation: shimmer 2s infinite;
      background-size: 200% 100%;
    }
  </style>
</head>
<body>
  <div class="particles">
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>
  <div id="app"></div>
  <div class="toast-container" id="toastContainer"></div>
  <div id="modalContainer"></div>

  <script>
    // ==================== STATE MANAGEMENT ====================
    const state = {
      user: null,
      token: localStorage.getItem('adminToken'),
      currentPage: 'dashboard',
      stats: null,
      users: [],
      games: [],
      notifications: [],
      settings: {},
      loading: false,
      errors: {},
      lastSync: null,
      syncInterval: null,
      isOnline: navigator.onLine,
      searchQueries: {
        users: '',
        games: ''
      }
    };

    // ==================== AUTO-SYNC SYSTEM ====================
    const SYNC_INTERVAL = 30000;

    const startAutoSync = () => {
      if (state.syncInterval) return;
      state.syncInterval = setInterval(async () => {
        if (!state.token || !state.user) return;
        try {
          await refreshCurrentPageData();
        } catch (error) {
          console.log('Auto-sync failed:', error.message);
        }
      }, SYNC_INTERVAL);
      window.addEventListener('online', handleOnline);
      window.addEventListener('offline', handleOffline);
    };

    const stopAutoSync = () => {
      if (state.syncInterval) {
        clearInterval(state.syncInterval);
        state.syncInterval = null;
      }
      window.removeEventListener('online', handleOnline);
      window.removeEventListener('offline', handleOffline);
    };

    const handleOnline = () => {
      state.isOnline = true;
      showToast('Connection restored', 'success');
      refreshCurrentPageData();
    };

    const handleOffline = () => {
      state.isOnline = false;
      showToast('You are offline', 'error');
    };

    const refreshCurrentPageData = async () => {
      if (!state.isOnline) return;
      try {
        switch (state.currentPage) {
          case 'dashboard':
            const statsData = await api('/admin/stats');
            if (JSON.stringify(state.stats) !== JSON.stringify(statsData.data)) {
              state.stats = statsData.data;
              state.lastSync = new Date().toISOString();
              render();
            }
            break;
          case 'users':
            const search = document.getElementById('userSearch')?.value || '';
            const usersData = await api(`/admin/users?search=${encodeURIComponent(search)}`);
            if (JSON.stringify(state.users) !== JSON.stringify(usersData.data)) {
              state.users = usersData.data || [];
              state.lastSync = new Date().toISOString();
              render();
            }
            break;
          case 'games':
            const gameSearch = document.getElementById('gameSearch')?.value || '';
            const gamesData = await api(`/admin/games?search=${encodeURIComponent(gameSearch)}`);
            if (JSON.stringify(state.games) !== JSON.stringify(gamesData.data)) {
              state.games = gamesData.data || [];
              state.lastSync = new Date().toISOString();
              render();
            }
            break;
          case 'notifications':
            const notifsData = await api('/admin/notifications');
            if (JSON.stringify(state.notifications) !== JSON.stringify(notifsData.data)) {
              state.notifications = notifsData.data || [];
              state.lastSync = new Date().toISOString();
              render();
            }
            break;
        }
      } catch (error) {
        console.log('Background sync error:', error.message);
      }
    };

    // ==================== API LAYER ====================
    const api = async (endpoint, options = {}) => {
      const headers = { ...options.headers };
      if (!(options.body instanceof FormData)) {
        headers['Content-Type'] = 'application/json';
      }
      if (state.token) {
        headers['Authorization'] = `Bearer ${state.token}`;
      }
      try {
        const response = await fetch(`/api${endpoint}`, { ...options, headers });
        const data = await response.json();
        if (!response.ok) {
          const error = new Error(data.message || data.error || 'Request failed');
          error.status = response.status;
          error.data = data;
          throw error;
        }
        return data;
      } catch (error) {
        if (error.status === 401) {
          handleLogout();
          showToast('Session expired. Please login again.', 'error');
        }
        throw error;
      }
    };

    // ==================== TOAST NOTIFICATIONS ====================
    const showToast = (message, type = 'success') => {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      const icons = {
        success: 'check-circle',
        error: 'exclamation-triangle',
        info: 'info-circle'
      };
      toast.innerHTML = `
        <i class="fas fa-${icons[type] || 'info-circle'}"></i>
        <span>${escapeHtml(message)}</span>
      `;
      container.appendChild(toast);
      setTimeout(() => {
        toast.classList.add('exit');
        setTimeout(() => toast.remove(), 300);
      }, 4000);
    };

    // ==================== MODAL SYSTEM ====================
    const showModal = (title, content, footer = '') => {
      const container = document.getElementById('modalContainer');
      container.innerHTML = `
        <div class="modal-overlay" onclick="closeModal(event)">
          <div class="modal" onclick="event.stopPropagation()">
            <div class="modal-header">
              <h3>${escapeHtml(title)}</h3>
              <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">${content}</div>
            ${footer ? `<div class="modal-footer">${footer}</div>` : ''}
          </div>
        </div>
      `;
    };

    const closeModal = (event) => {
      if (!event || event.target.classList.contains('modal-overlay')) {
        document.getElementById('modalContainer').innerHTML = '';
      }
    };

    const showConfirm = (message, onConfirm) => {
      const content = `
        <div class="confirm-dialog">
          <i class="fas fa-exclamation-triangle"></i>
          <p>${escapeHtml(message)}</p>
          <div class="btn-group">
            <button class="btn btn-secondary btn-sm" onclick="closeModal()">Cancel</button>
            <button class="btn btn-danger btn-sm" onclick="(${onConfirm.toString()})(); closeModal();">Confirm</button>
          </div>
        </div>
      `;
      showModal('Confirm Action', content);
    };

    // ==================== SECURITY HELPERS ====================
    const escapeHtml = (str) => {
      if (!str) return '';
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    };

    // ==================== RENDER FUNCTIONS ====================
    const render = () => {
      const app = document.getElementById('app');
      if (!state.token || !state.user) {
        app.innerHTML = renderLogin();
        return;
      }
      app.innerHTML = renderApp();
      loadPageData();
    };

    const renderLogin = () => `
      <div class="login-container">
        <div class="login-box">
          <h1><i class="fas fa-gamepad"></i> KISKU</h1>
          <p>Neo-Brutalism Admin Panel</p>
          <form onsubmit="handleLogin(event)">
            <div class="form-group">
              <label>Email</label>
              <input type="email" id="loginEmail" required placeholder="admin@example.com" autocomplete="email">
            </div>
            <div class="form-group">
              <label>Password</label>
              <input type="password" id="loginPassword" required placeholder="Enter password" autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary btn-block">
              <i class="fas fa-sign-in-alt"></i> Sign In
            </button>
          </form>
          <div style="text-align: center; margin-top: 28px;">
            <button onclick="showSetup()" class="btn btn-outline btn-sm">First Time Setup</button>
          </div>
        </div>
      </div>
    `;

    const renderApp = () => `
      <div class="app-container">
        <aside class="sidebar" id="sidebar">
          <div class="sidebar-header">
            <h2><i class="fas fa-gamepad"></i> KISKU</h2>
            <span>NEO-BRUTALISM</span>
          </div>
          <nav class="sidebar-nav">
            <div class="nav-section">Main</div>
            <a class="nav-item ${state.currentPage === 'dashboard' ? 'active' : ''}" onclick="navigate('dashboard')">
              <i class="fas fa-chart-pie"></i> <span>Dashboard</span>
            </a>
            <div class="nav-section">Management</div>
            <a class="nav-item ${state.currentPage === 'users' ? 'active' : ''}" onclick="navigate('users')">
              <i class="fas fa-users"></i> <span>Users</span>
            </a>
            <a class="nav-item ${state.currentPage === 'games' ? 'active' : ''}" onclick="navigate('games')">
              <i class="fas fa-gamepad"></i> <span>Games</span>
            </a>
            <a class="nav-item ${state.currentPage === 'notifications' ? 'active' : ''}" onclick="navigate('notifications')">
              <i class="fas fa-bell"></i> <span>Notifications</span>
            </a>
            <div class="nav-section">System</div>
            <a class="nav-item ${state.currentPage === 'settings' ? 'active' : ''}" onclick="navigate('settings')">
              <i class="fas fa-cog"></i> <span>Settings</span>
            </a>
          </nav>
        </aside>
        <main class="main-content">
          <header class="header">
            <h1>${{
              dashboard: 'Dashboard',
              users: 'User Management',
              games: 'Game Management',
              notifications: 'Notifications',
              settings: 'Settings'
            }[state.currentPage]}</h1>
            <div class="user-info" onclick="handleLogout()">
              <div class="user-avatar">${state.user?.username?.charAt(0).toUpperCase() || 'A'}</div>
              <span>${escapeHtml(state.user?.username || 'Admin')}</span>
              <i class="fas fa-sign-out-alt"></i>
            </div>
          </header>
          <div class="content">${renderPageContent()}</div>
        </main>
      </div>
    `;

    const renderPageContent = () => {
      if (state.loading) {
        return '<div class="loading"><div class="spinner"></div><span class="loading-text">Loading...</span></div>';
      }
      switch (state.currentPage) {
        case 'dashboard': return renderDashboard();
        case 'users': return renderUsers();
        case 'games': return renderGames();
        case 'notifications': return renderNotifications();
        case 'settings': return renderSettings();
        default: return renderDashboard();
      }
    };

    const renderDashboard = () => `
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-card-header">
            <div>
              <h4>Total Users</h4>
              <div class="value">${state.stats?.users?.total?.toLocaleString() || 0}</div>
            </div>
            <div class="stat-card-icon primary"><i class="fas fa-users"></i></div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-card-header">
            <div>
              <h4>Total Games</h4>
              <div class="value">${state.stats?.games?.total?.toLocaleString() || 0}</div>
            </div>
            <div class="stat-card-icon success"><i class="fas fa-gamepad"></i></div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-card-header">
            <div>
              <h4>Total Plays</h4>
              <div class="value">${state.stats?.games?.totalPlays?.toLocaleString() || 0}</div>
            </div>
            <div class="stat-card-icon warning"><i class="fas fa-play"></i></div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-card-header">
            <div>
              <h4>Active Notifs</h4>
              <div class="value">${state.stats?.notifications?.active?.toLocaleString() || 0}</div>
            </div>
            <div class="stat-card-icon info"><i class="fas fa-bell"></i></div>
          </div>
        </div>
      </div>
      <div class="grid-2">
        <div class="card">
          <div class="card-header"><h3>Recent Games</h3></div>
          <div class="card-body">
            ${state.stats?.recent?.games?.length ? `
              <table>
                <thead><tr><th>Title</th><th>Plays</th><th>Date</th></tr></thead>
                <tbody>
                  ${state.stats.recent.games.map(g => `
                    <tr>
                      <td><strong>${escapeHtml(g.title)}</strong></td>
                      <td>${g.plays?.toLocaleString() || 0}</td>
                      <td>${new Date(g.created_at).toLocaleDateString()}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            ` : '<div class="empty-state"><i class="fas fa-gamepad"></i><p>No games yet</p></div>'}
          </div>
        </div>
        <div class="card">
          <div class="card-header"><h3>Recent Users</h3></div>
          <div class="card-body">
            ${state.stats?.recent?.users?.length ? `
              <table>
                <thead><tr><th>Username</th><th>Email</th><th>Joined</th></tr></thead>
                <tbody>
                  ${state.stats.recent.users.map(u => `
                    <tr>
                      <td><strong>${escapeHtml(u.username)}</strong></td>
                      <td>${escapeHtml(u.email)}</td>
                      <td>${new Date(u.created_at).toLocaleDateString()}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            ` : '<div class="empty-state"><i class="fas fa-users"></i><p>No users yet</p></div>'}
          </div>
        </div>
      </div>
    `;

    const renderUsers = () => `
      <div class="card">
        <div class="card-header"><h3>All Users</h3></div>
        <div class="card-body">
          <div class="search-bar">
            <div class="search-input">
              <input type="text" placeholder="Search users..." id="userSearch" value="${escapeHtml(state.searchQueries.users)}" onkeyup="handleUserSearch(this.value)" oninput="state.searchQueries.users = this.value">
              <i class="fas fa-search"></i>
            </div>
          </div>
          <table>
            <thead><tr><th>User</th><th>Email</th><th>Role</th><th>Status</th><th>Joined</th><th>Actions</th></tr></thead>
            <tbody>
              ${state.users.length ? state.users.map(u => `
                <tr>
                  <td><div style="display:flex;align-items:center;gap:12px;"><div class="table-avatar">${escapeHtml(u.username.charAt(0).toUpperCase())}</div><strong>${escapeHtml(u.username)}</strong></div></td>
                  <td>${escapeHtml(u.email)}</td>

          <div class="card-body">

              <div class="form-group"><label>Title</label><input type="text" id="pushTitle" required placeholder="Notification title"></div>
              <div class="form-group"><label>Message</label><textarea id="pushMessage" required placeholder="Notification message" rows="4"></textarea></div>
              <div class="form-group"><label>Segment</label><select id="pushSegment"><option value="All">All Users</option><option value="Active Users">Active Users</option></select></div>

    const renderSettings = () => `
      <div class="tabs">
        <div class="tab active" onclick="switchSettingsTab('general', this)">General</div>
        <div class="tab" onclick="switchSettingsTab('onesignal', this)">OneSignal</div>
        <div class="tab" onclick="switchSettingsTab('uploads', this)">Uploads</div>
        <div class="tab" onclick="switchSettingsTab('features', this)">Features</div>

      <div id="generalSettings" class="tab-content active">
        <div class="card">
          <div class="card-header"><h3>General Settings</h3><button onclick="saveSettings()" class="btn btn-success btn-sm"><i class="fas fa-save"></i> Save</button></div>
          <div class="card-body">
            <div class="settings-section">
              <h4>Application</h4>
              <div class="settings-group">
                <div class="setting-item"><label>App Name</label><input type="text" id="setting_app_name" value="${escapeHtml(state.settings.app_name?.value || '')}"></div>
                <div class="setting-item"><label>App Version</label><input type="text" id="setting_app_version" value="${escapeHtml(state.settings.app_version?.value || '')}"></div>
                <div class="setting-item"><label>Support Email</label><input type="email" id="setting_support_email" value="${escapeHtml(state.settings.support_email?.value || '')}"></div>
              </div>
            </div>
            <div class="settings-section">
              <h4>Maintenance</h4>
              <div class="settings-group">
                <div class="setting-item"><label>Maintenance Mode</label><label class="toggle"><input type="checkbox" id="setting_maintenance_mode" ${state.settings.maintenance_mode?.value ? 'checked' : ''}><span class="toggle-slider"></span></label><div class="help-text">Show maintenance message to users</div></div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div id="onesignalSettings" class="tab-content">
        <div class="card">
          <div class="card-header"><h3>OneSignal Config</h3><button onclick="saveSettings()" class="btn btn-success btn-sm"><i class="fas fa-save"></i> Save</button></div>
          <div class="card-body">
            <div class="settings-section">
              <h4>Configuration</h4>
              <div class="settings-group">
                <div class="setting-item"><label>Enable OneSignal</label><label class="toggle"><input type="checkbox" id="setting_onesignal_enabled" ${state.settings.onesignal_enabled?.value ? 'checked' : ''}><span class="toggle-slider"></span></label></div>
                <div class="setting-item"><label>App ID</label><input type="text" id="setting_onesignal_app_id" value="${escapeHtml(state.settings.onesignal_app_id?.value || '')}" placeholder="OneSignal App ID"><div class="help-text">Find in OneSignal Dashboard</div></div>
                <div class="setting-item"><label>REST API Key</label><input type="password" id="setting_onesignal_api_key" value="${escapeHtml(state.settings.onesignal_api_key?.value || '')}" placeholder="REST API Key"><div class="help-text">Keep this secret!</div></div>
              </div>
            </div>
            <button onclick="testOneSignal()" class="btn btn-info" style="margin-top:20px;"><i class="fas fa-plug"></i> Test Connection</button>
          </div>

      <div id="uploadsSettings" class="tab-content">

          <div class="card-body">
            <div class="settings-section">
              <h4>File Size Limits</h4>
              <div class="settings-group">
                <div class="setting-item"><label>Max Game Size (MB)</label><input type="number" id="setting_max_upload_size" value="${state.settings.max_upload_size?.value || 100}" min="1" max="500"><div class="help-text">Maximum ZIP file size</div></div>
                <div class="setting-item"><label>Max Thumbnail (MB)</label><input type="number" id="setting_max_thumbnail_size" value="${state.settings.max_thumbnail_size?.value || 5}" min="1" max="20"><div class="help-text">Maximum thumbnail size</div></div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div id="featuresSettings" class="tab-content">
        <div class="card">
          <div class="card-header"><h3>Feature Toggles</h3><button onclick="saveSettings()" class="btn btn-success btn-sm"><i class="fas fa-save"></i> Save</button></div>
          <div class="card-body">
            <div class="settings-group">
              <div class="setting-item"><label>User Registration</label><label class="toggle"><input type="checkbox" id="setting_registration_enabled" ${state.settings.registration_enabled?.value ? 'checked' : ''}><span class="toggle-slider"></span></label><div class="help-text">Allow new registrations</div></div>
              <div class="setting-item"><label>Guest Play</label><label class="toggle"><input type="checkbox" id="setting_guest_play_enabled" ${state.settings.guest_play_enabled?.value ? 'checked' : ''}><span class="toggle-slider"></span></label><div class="help-text">Play without account</div></div>
              <div class="setting-item"><label>Ratings</label><label class="toggle"><input type="checkbox" id="setting_ratings_enabled" ${state.settings.ratings_enabled?.value ? 'checked' : ''}><span class="toggle-slider"></span></label><div class="help-text">Enable game ratings</div></div>
              <div class="setting-item"><label>Analytics</label><label class="toggle"><input type="checkbox" id="setting_analytics_enabled" ${state.settings.analytics_enabled?.value ? 'checked' : ''}><span class="toggle-slider"></span></label><div class="help-text">Track usage analytics</div></div>
              <div class="setting-item"><label>Featured Count</label><input type="number" id="setting_featured_games_count" value="${state.settings.featured_games_count?.value || 10}" min="1" max="50"><div class="help-text">Number of featured games</div></div>
            </div>
          </div>
        </div>
      </div>
    `;

    // ==================== EVENT HANDLERS ====================
    const handleLogin = async (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      if (!email || !password) { showToast('Please fill in all fields', 'error'); return; }
      try {
        const data = await api('/auth/login', { method: 'POST', body: JSON.stringify({ email, password }) });
        if (data.data.user.role !== 'admin') { showToast('Admin access required', 'error'); return; }
        state.token = data.data.token;
        state.user = data.data.user;
        localStorage.setItem('adminToken', data.data.token);
        startAutoSync();
        showToast('Login successful!', 'success');
        render();
      } catch (error) {
        showToast(error.message || 'Login failed', 'error');
      }
    };

    const handleLogout = () => {
      stopAutoSync();
      state.token = null;
      state.user = null;
      state.stats = null;
      state.users = [];
      state.games = [];
      state.notifications = [];
      state.settings = {};
      state.lastSync = null;
      localStorage.removeItem('adminToken');
      render();
    };

    const navigate = (page) => {
      state.currentPage = page;
      state.loading = true;
      render();
    };

    // ==================== DATA LOADING ====================
    const loadPageData = async () => {
      state.loading = true;
      render(); // Show loading state immediately
      try {
        switch (state.currentPage) {
          case 'dashboard': await loadStats(); break;
          case 'users': await loadUsers(); break;
          case 'games': await loadGames(); break;
          case 'notifications': await loadNotifications(); break;
          case 'settings': await loadSettings(); break;
        }
      } catch (error) {
        console.error(`Error loading ${state.currentPage}:`, error);
        showToast(`Error loading ${state.currentPage}: ${error.message}`, 'error');
        state.loading = false;
        render(); // Re-render to clear loading state on error
      }
    };

    const loadStats = async () => {
      const data = await api('/admin/stats');
      state.stats = data.data;
      state.loading = false;
      render();
    };

    const loadUsers = async () => {
      const search = state.searchQueries.users || '';
      const data = await api(`/admin/users?search=${encodeURIComponent(search)}`);
      state.users = data.data || [];
      state.loading = false;
      render();
    };

    const loadGames = async () => {
      const search = state.searchQueries.games || '';
      const data = await api(`/admin/games?search=${encodeURIComponent(search)}`);
      state.games = data.data || [];
      state.loading = false;
      render();
    };

    const loadNotifications = async () => {
      const data = await api('/admin/notifications');
      state.notifications = data.data || [];
      state.loading = false;
      render();
    };

    const loadSettings = async () => {
      const data = await api('/admin/settings');
      state.settings = data.data || {};
      state.loading = false;
      render();
    };

    // ==================== USER ACTIONS ====================
    const toggleUserStatus = async (id) => {
      try {
        await api(`/admin/users/${id}/toggle-active`, { method: 'PUT' });
        showToast('User status updated', 'success');
        loadUsers();
      } catch (error) {
        showToast(error.message, 'error');
      }
    };

    const changeUserRole = async (id, currentRole) => {
      const newRole = currentRole === 'admin' ? 'user' : 'admin';
      showConfirm(`Change role to ${newRole}?`, async () => {
        try {
          await api(`/admin/users/${id}/role`, { method: 'PUT', body: JSON.stringify({ role: newRole }) });
          showToast('Role updated', 'success');
          loadUsers();
        } catch (error) {
          showToast(error.message, 'error');
        }
      });
    };

    const confirmDeleteUser = (id) => {
      const user = state.users.find(u => u.id === id);
      const username = user ? user.username : 'Unknown';
      showConfirm(`Delete user "${escapeHtml(username)}"? This action cannot be undone.`, async () => {
        try {
          await api(`/admin/users/${id}`, { method: 'DELETE' });
          showToast('User deleted', 'success');
          loadUsers();
        } catch (error) {
          showToast(error.message, 'error');
        }
      });
    };

    const handleUserSearch = debounce((value) => {
      state.searchQueries.users = value;
      loadUsers();
    }, 500);

    // ==================== GAME ACTIONS ====================
    const toggleGameFeatured = async (id) => {
      try {
        await api(`/admin/games/${id}/toggle-featured`, { method: 'PUT' });
        showToast('Featured status updated', 'success');
        loadGames();
      } catch (error) {
        showToast(error.message, 'error');
      }
    };

    const toggleGameActive = async (id) => {
      try {
        await api(`/admin/games/${id}/toggle-active`, { method: 'PUT' });
        showToast('Game status updated', 'success');
        loadGames();
      } catch (error) {
        showToast(error.message, 'error');
      }
    };

    const confirmDeleteGame = (id) => {
      const game = state.games.find(g => g.id === id);
      const title = game ? game.title : 'Unknown';
      showConfirm(`Delete game "${escapeHtml(title)}"? This will also delete all game files. This action cannot be undone.`, async () => {
        try {
          await api(`/admin/games/${id}`, { method: 'DELETE' });
          showToast('Game deleted', 'success');
          loadGames();
        } catch (error) {
          showToast(error.message, 'error');
        }
      });
    };

    const handleGameSearch = debounce((value) => {
      state.searchQueries.games = value;
      loadGames();
    }, 500);

    // ==================== NOTIFICATION ACTIONS ====================
    const confirmDeleteNotification = (id) => { showConfirm('Delete this notification?', async () => { try { await api(`/admin/notifications/${id}`, { method: 'DELETE' }); showToast('Notification deleted', 'success'); loadNotifications(); } catch (error) { showToast(error.message, 'error'); } }); };

    // ==================== SETTINGS ACTIONS ====================
    const saveSettings = async () => {
      const settings = {};
      document.querySelectorAll('[id^="setting_"]').forEach(input => {
        const key = input.id.replace('setting_', '');
        settings[key] = input.type === 'checkbox' ? input.checked : input.value;
      });
      try { await api('/admin/settings', { method: 'PUT', body: JSON.stringify({ settings }) }); showToast('Settings saved', 'success'); loadSettings(); } catch (error) { showToast(error.message, 'error'); }
    };

    const testOneSignal = async () => {
      try {
        const appId = document.getElementById('setting_onesignal_app_id').value;
        const apiKey = document.getElementById('setting_onesignal_api_key').value;
        if (!appId || !apiKey) { showToast('Please enter App ID and API Key', 'error'); return; }
        const data = await api('/admin/test-onesignal', { method: 'POST', body: JSON.stringify({ appId, apiKey }) });
        if (data.data && data.data.appName) { showToast(`Connected! App: ${data.data.appName}`, 'success'); } else { showToast('Connection successful!', 'success'); }
      } catch (error) { showToast(error.message || 'Connection failed', 'error'); }
    };

    const sendPushNotification = async (e) => {
      e.preventDefault();
      const title = document.getElementById('pushTitle').value.trim();
      const message = document.getElementById('pushMessage').value.trim();
      const segment = document.getElementById('pushSegment').value;
      if (!title || !message) { showToast('Please fill in all fields', 'error'); return; }
      try { await api('/admin/push-notifications', { method: 'POST', body: JSON.stringify({ title, message, segment }) }); showToast('Push notification sent!', 'success'); document.getElementById('pushTitle').value = ''; document.getElementById('pushMessage').value = ''; } catch (error) { showToast(error.message, 'error'); }
    };

    // ==================== MODAL FUNCTIONS ====================
    const showGameModal = () => {
      const content = `
        <form id="gameForm" onsubmit="createGame(event)">
          <div class="form-group"><label>Game Title *</label><input type="text" id="gameTitle" required placeholder="Enter game title"></div>
          <div class="form-group"><label>Description *</label><textarea id="gameDescription" required placeholder="Game description" rows="3"></textarea></div>
          <div class="form-group"><label>Category</label><select id="gameCategory"><option value="action">Action</option><option value="puzzle">Puzzle</option><option value="arcade">Arcade</option><option value="sports">Sports</option><option value="racing">Racing</option><option value="strategy">Strategy</option><option value="casual" selected>Casual</option><option value="adventure">Adventure</option></select></div>
          <div class="form-group"><label>Difficulty</label><select id="gameDifficulty"><option value="easy">Easy</option><option value="medium" selected>Medium</option><option value="hard">Hard</option></select></div>
          <div class="form-group"><label>Tags (comma separated)</label><input type="text" id="gameTags" placeholder="fun, multiplayer, classic"></div>
          <div class="form-group"><label>Controls</label><textarea id="gameControls" placeholder="Arrow keys to move, Space to jump" rows="2"></textarea></div>
          <div class="form-group"><label>Game File (ZIP) *</label><div class="file-upload-area" onclick="document.getElementById('gameFile').click()"><i class="fas fa-file-archive"></i><p id="gameFileName">Click to select ZIP file</p></div><input type="file" id="gameFile" accept=".zip" style="display:none" onchange="handleFileSelect(this, 'gameFileName')"></div>
          <div class="form-group"><label>Thumbnail Image</label><div class="file-upload-area" onclick="document.getElementById('gameThumbnail').click()"><i class="fas fa-image"></i><p id="thumbnailFileName">Click to select thumbnail</p></div><input type="file" id="gameThumbnail" accept="image/*" style="display:none" onchange="handleFileSelect(this, 'thumbnailFileName'); previewThumbnail(this)"><img id="thumbnailPreview" style="display:none; max-width:200px; margin-top:10px; border-radius:8px;"></div>
        </form>
      `;
      const footer = `<button class="btn btn-secondary btn-sm" onclick="closeModal()">Cancel</button><button class="btn btn-primary btn-sm" onclick="document.getElementById('gameForm').requestSubmit()"><i class="fas fa-upload"></i> Upload</button>`;
      showModal('Upload New Game', content, footer);
    };

    const handleFileSelect = (input, labelId) => {
      const file = input.files[0];
      if (file) {
        const isGameFile = input.id === 'gameFile';
        const maxSize = isGameFile ? 100 * 1024 * 1024 : 5 * 1024 * 1024;
        if (file.size > maxSize) { showToast(`File too large. Max: ${isGameFile ? '100MB' : '5MB'}`, 'error'); input.value = ''; return; }
        document.getElementById(labelId).textContent = file.name;
        const uploadArea = input.previousElementSibling;
        if (uploadArea?.classList.contains('file-upload-area')) uploadArea.classList.add('has-file');
      }
    };

    const previewThumbnail = (input) => {
      const file = input.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (e) => { const preview = document.getElementById('thumbnailPreview'); preview.src = e.target.result; preview.style.display = 'block'; };
        reader.readAsDataURL(file);
      }
    };

    const createGame = async (e) => {
      e.preventDefault();
      const title = document.getElementById('gameTitle').value.trim();
      const description = document.getElementById('gameDescription').value.trim();
      const gameFile = document.getElementById('gameFile').files[0];
      const thumbnail = document.getElementById('gameThumbnail').files[0];
      if (!title || title.length < 3) { showToast('Title must be at least 3 characters', 'error'); return; }
      if (!description || description.length < 10) { showToast('Description must be at least 10 characters', 'error'); return; }
      if (!gameFile) { showToast('Please select a game ZIP file', 'error'); return; }
      const formData = new FormData();
      formData.append('title', title);
      formData.append('description', description);
      formData.append('category', document.getElementById('gameCategory').value);
      formData.append('difficulty', document.getElementById('gameDifficulty').value);
      formData.append('controls', document.getElementById('gameControls').value.trim());
      const tags = document.getElementById('gameTags').value.split(',').map(t => t.trim()).filter(t => t);
      formData.append('tags', JSON.stringify(tags));
      formData.append('gameFile', gameFile);
      if (thumbnail) formData.append('thumbnail', thumbnail);
      try {
        const response = await fetch('/api/admin/games', { method: 'POST', headers: { 'Authorization': `Bearer ${state.token}` }, body: formData });
        const data = await response.json();
        if (!response.ok) throw new Error(data.message || 'Failed to upload');
        showToast('Game uploaded!', 'success');
        closeModal();
        loadGames();
      } catch (error) { showToast(error.message, 'error'); }
    };

    const showEditGameModal = async (id) => {
      const game = state.games.find(g => g.id === id);
      if (!game) {
        showToast('Game not found', 'error');
        return;
      }

      const content = `
        <form id="editGameForm" onsubmit="updateGame(event, ${id})">
          <div class="form-group"><label>Game Title *</label><input type="text" id="editGameTitle" required value="${escapeHtml(game.title)}" placeholder="Enter game title"></div>
          <div class="form-group"><label>Description *</label><textarea id="editGameDescription" required placeholder="Game description" rows="3">${escapeHtml(game.description || '')}</textarea></div>
          <div class="form-group"><label>Category</label><select id="editGameCategory">
            <option value="action" ${game.category === 'action' ? 'selected' : ''}>Action</option>
            <option value="puzzle" ${game.category === 'puzzle' ? 'selected' : ''}>Puzzle</option>
            <option value="arcade" ${game.category === 'arcade' ? 'selected' : ''}>Arcade</option>
            <option value="sports" ${game.category === 'sports' ? 'selected' : ''}>Sports</option>
            <option value="racing" ${game.category === 'racing' ? 'selected' : ''}>Racing</option>
            <option value="strategy" ${game.category === 'strategy' ? 'selected' : ''}>Strategy</option>
            <option value="casual" ${game.category === 'casual' ? 'selected' : ''}>Casual</option>
            <option value="adventure" ${game.category === 'adventure' ? 'selected' : ''}>Adventure</option>
          </select></div>
          <div class="form-group"><label>Difficulty</label><select id="editGameDifficulty">
            <option value="easy" ${game.difficulty === 'easy' ? 'selected' : ''}>Easy</option>
            <option value="medium" ${game.difficulty === 'medium' ? 'selected' : ''}>Medium</option>
            <option value="hard" ${game.difficulty === 'hard' ? 'selected' : ''}>Hard</option>
          </select></div>
          <div class="form-group"><label>Tags (comma separated)</label><input type="text" id="editGameTags" value="${escapeHtml(Array.isArray(game.tags) ? game.tags.join(', ') : (game.tags || ''))}" placeholder="fun, multiplayer, classic"></div>
          <div class="form-group"><label>Controls</label><textarea id="editGameControls" placeholder="Arrow keys to move, Space to jump" rows="2">${escapeHtml(game.controls || '')}</textarea></div>
          <div class="form-group"><label>New Game File (ZIP) - Optional</label><div class="file-upload-area" onclick="document.getElementById('editGameFile').click()"><i class="fas fa-file-archive"></i><p id="editGameFileName">Click to replace game files</p></div><input type="file" id="editGameFile" accept=".zip" style="display:none" onchange="handleFileSelect(this, 'editGameFileName')"></div>
          <div class="form-group"><label>New Thumbnail - Optional</label><div class="file-upload-area" onclick="document.getElementById('editGameThumbnail').click()"><i class="fas fa-image"></i><p id="editThumbnailFileName">Click to replace thumbnail</p></div><input type="file" id="editGameThumbnail" accept="image/*" style="display:none" onchange="handleFileSelect(this, 'editThumbnailFileName')"></div>
          ${game.thumbnail ? `<div style="margin-top:10px;"><img src="${escapeHtml(game.thumbnail)}" style="max-width:200px;border-radius:8px;" alt="Current thumbnail"></div>` : ''}
        </form>
      `;
      const footer = `<button class="btn btn-secondary btn-sm" onclick="closeModal()">Cancel</button><button class="btn btn-primary btn-sm" onclick="document.getElementById('editGameForm').requestSubmit()"><i class="fas fa-save"></i> Save Changes</button>`;
      showModal('Edit Game', content, footer);
    };

    const updateGame = async (e, id) => {
      e.preventDefault();
      const title = document.getElementById('editGameTitle').value.trim();
      const description = document.getElementById('editGameDescription').value.trim();
      const gameFile = document.getElementById('editGameFile').files[0];
      const thumbnail = document.getElementById('editGameThumbnail').files[0];

      if (!title || title.length < 3) { showToast('Title must be at least 3 characters', 'error'); return; }
      if (!description || description.length < 10) { showToast('Description must be at least 10 characters', 'error'); return; }

      const formData = new FormData();
      formData.append('title', title);
      formData.append('description', description);
      formData.append('category', document.getElementById('editGameCategory').value);
      formData.append('difficulty', document.getElementById('editGameDifficulty').value);
      formData.append('controls', document.getElementById('editGameControls').value.trim());
      const tags = document.getElementById('editGameTags').value.split(',').map(t => t.trim()).filter(t => t);
      formData.append('tags', JSON.stringify(tags));
      if (gameFile) formData.append('gameFile', gameFile);
      if (thumbnail) formData.append('thumbnail', thumbnail);

      try {
        const response = await fetch(`/api/admin/games/${id}`, { method: 'PUT', headers: { 'Authorization': `Bearer ${state.token}` }, body: formData });
        const data = await response.json();
        if (!response.ok) throw new Error(data.message || 'Failed to update');
        showToast('Game updated!', 'success');
        closeModal();
        loadGames();
      } catch (error) { showToast(error.message, 'error'); }
    };

    const showNotificationModal = () => {
      const content = `
        <form id="notificationForm" onsubmit="createNotification(event)">
          <div class="form-group"><label>Title</label><input type="text" id="notifTitle" required placeholder="Notification title"></div>
          <div class="form-group"><label>Message</label><textarea id="notifMessage" required placeholder="Notification message" rows="3"></textarea></div>
          <div class="form-group"><label>Type</label><select id="notifType"><option value="info">Info</option><option value="success">Success</option><option value="warning">Warning</option><option value="error">Error</option><option value="promotion">Promotion</option></select></div>
          <div class="form-group"><label>Target Audience</label><select id="notifAudience"><option value="all">All Users</option><option value="users">Users Only</option><option value="admins">Admins Only</option></select></div>
        </form>
      `;
      const footer = `<button class="btn btn-secondary btn-sm" onclick="closeModal()">Cancel</button><button class="btn btn-primary btn-sm" onclick="document.getElementById('notificationForm').requestSubmit()"><i class="fas fa-plus"></i> Create</button>`;
      showModal('Create Notification', content, footer);
    };

    const createNotification = async (e) => {
      e.preventDefault();
      const notifData = { title: document.getElementById('notifTitle').value.trim(), message: document.getElementById('notifMessage').value.trim(), type: document.getElementById('notifType').value, target_audience: document.getElementById('notifAudience').value };
      try { await api('/admin/notifications', { method: 'POST', body: JSON.stringify(notifData) }); showToast('Notification created!', 'success'); closeModal(); loadNotifications(); } catch (error) { showToast(error.message, 'error'); }
    };

    const showSetup = async () => {
      const content = `
        <form id="setupForm" onsubmit="handleSetup(event)">
          <div class="form-group"><label>Admin Username</label><input type="text" id="setupUsername" required placeholder="admin" minlength="3"></div>
          <div class="form-group"><label>Admin Email</label><input type="email" id="setupEmail" required placeholder="admin@example.com"></div>
          <div class="form-group"><label>Admin Password</label><input type="password" id="setupPassword" required placeholder="Strong password" minlength="6"></div>
        </form>
      `;
      const footer = `<button class="btn btn-secondary btn-sm" onclick="closeModal()">Cancel</button><button class="btn btn-primary btn-sm" onclick="document.getElementById('setupForm').requestSubmit()"><i class="fas fa-user-plus"></i> Create Admin</button>`;
      showModal('First Time Setup', content, footer);
    };

    const handleSetup = async (e) => {
      e.preventDefault();
      const username = document.getElementById('setupUsername').value.trim();
      const email = document.getElementById('setupEmail').value.trim();
      const password = document.getElementById('setupPassword').value;
      try { await api('/admin/setup', { method: 'POST', body: JSON.stringify({ username, email, password }) }); showToast('Admin created!', 'success'); closeModal(); } catch (error) { showToast(error.message, 'error'); }
    };

    // ==================== TAB SWITCHING ====================
    const switchNotificationTab = (tab, el) => {
      document.querySelectorAll('#app .tabs .tab').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
      document.getElementById('inappNotifications').classList.toggle('active', tab === 'inapp');
      document.getElementById('pushNotifications').classList.toggle('active', tab === 'push');
    };

    const switchSettingsTab = (tab, el) => {
      // Only target settings tabs, not notification tabs
      const settingsContainer = el.closest('.content');
      settingsContainer.querySelectorAll('.tabs .tab').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
      // Hide all settings tab contents
      ['generalSettings', 'onesignalSettings', 'uploadsSettings', 'featuresSettings'].forEach(id => {
        const elem = document.getElementById(id);
        if (elem) elem.classList.remove('active');
      });
      document.getElementById(tab + 'Settings').classList.add('active');
    };

    // ==================== UTILITIES ====================
    const debounce = (fn, delay) => { let timeout; return (...args) => { clearTimeout(timeout); timeout = setTimeout(() => fn(...args), delay); }; };
    const debouncedLoadUsers = debounce(loadUsers, 500);
    const debouncedLoadGames = debounce(loadGames, 500);

    // ==================== INITIALIZATION ====================
    const init = async () => {
      if (state.token) {
        try {
          const data = await api('/auth/me');
          if (!data.data || data.data.role !== 'admin') { handleLogout(); showToast('Admin access required', 'error'); return; }
          state.user = data.data;
          startAutoSync();
        } catch (error) { handleLogout(); }
      }
      render();
    };

    init();
    window.addEventListener('beforeunload', stopAutoSync);
  </script>
</body>
</html>
