<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - TikTok Games</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --secondary: #f1f5f9;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --dark: #1e293b;
      --gray: #64748b;
      --light: #f8fafc;
      --sidebar-width: 260px;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--secondary); min-height: 100vh; }

    /* Login Page */
    .login-container { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); }
    .login-box { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); width: 100%; max-width: 400px; }
    .login-box h1 { text-align: center; margin-bottom: 30px; color: var(--dark); }
    .login-box .logo { text-align: center; font-size: 48px; margin-bottom: 20px; }

    /* Forms */
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 8px; font-weight: 500; color: var(--dark); }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%; padding: 12px 16px; border: 2px solid #e2e8f0; border-radius: 8px;
      font-size: 14px; transition: all 0.3s;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
    }
    .form-group textarea { resize: vertical; min-height: 100px; }

    /* Buttons */
    .btn { padding: 12px 24px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.3s; display: inline-flex; align-items: center; gap: 8px; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-dark); transform: translateY(-2px); }
    .btn-success { background: var(--success); color: white; }
    .btn-danger { background: var(--danger); color: white; }
    .btn-secondary { background: var(--secondary); color: var(--dark); }
    .btn-sm { padding: 8px 16px; font-size: 12px; }
    .btn-block { width: 100%; justify-content: center; }

    /* Layout */
    .app-container { display: flex; min-height: 100vh; }

    /* Sidebar */
    .sidebar {
      width: var(--sidebar-width); background: var(--dark); color: white; position: fixed;
      height: 100vh; overflow-y: auto; transition: all 0.3s;
    }
    .sidebar-header { padding: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .sidebar-header h2 { font-size: 20px; }
    .sidebar-header p { font-size: 12px; opacity: 0.7; margin-top: 4px; }
    .sidebar-nav { padding: 20px 0; }
    .nav-item {
      padding: 12px 20px; display: flex; align-items: center; gap: 12px; cursor: pointer;
      transition: all 0.3s; color: rgba(255,255,255,0.7);
    }
    .nav-item:hover, .nav-item.active { background: rgba(255,255,255,0.1); color: white; }
    .nav-item i { width: 20px; text-align: center; }
    .sidebar-footer { position: absolute; bottom: 0; left: 0; right: 0; padding: 20px; border-top: 1px solid rgba(255,255,255,0.1); }

    /* Main Content */
    .main-content { margin-left: var(--sidebar-width); flex: 1; padding: 30px; }
    .page-header { margin-bottom: 30px; }
    .page-header h1 { font-size: 28px; color: var(--dark); margin-bottom: 8px; }
    .page-header p { color: var(--gray); }

    /* Cards */
    .card { background: white; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); padding: 24px; margin-bottom: 20px; }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .card-header h3 { font-size: 18px; color: var(--dark); }

    /* Stats Grid */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-bottom: 30px; }
    .stat-card { background: white; border-radius: 12px; padding: 24px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    .stat-card .icon { width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; margin-bottom: 16px; }
    .stat-card .icon.primary { background: rgba(99, 102, 241, 0.1); color: var(--primary); }
    .stat-card .icon.success { background: rgba(16, 185, 129, 0.1); color: var(--success); }
    .stat-card .icon.warning { background: rgba(245, 158, 11, 0.1); color: var(--warning); }
    .stat-card .icon.danger { background: rgba(239, 68, 68, 0.1); color: var(--danger); }
    .stat-card h4 { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--gray); margin-bottom: 8px; }
    .stat-card .value { font-size: 32px; font-weight: 700; color: var(--dark); }

    /* Table */
    .table-container { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #e2e8f0; }
    th { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--gray); font-weight: 600; }
    td { color: var(--dark); }
    tr:hover { background: var(--light); }

    /* Badges */
    .badge { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
    .badge-success { background: rgba(16, 185, 129, 0.1); color: var(--success); }
    .badge-danger { background: rgba(239, 68, 68, 0.1); color: var(--danger); }
    .badge-warning { background: rgba(245, 158, 11, 0.1); color: var(--warning); }
    .badge-primary { background: rgba(99, 102, 241, 0.1); color: var(--primary); }

    /* Modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 1000; }
    .modal-overlay.active { display: flex; }
    .modal { background: white; border-radius: 16px; width: 100%; max-width: 600px; max-height: 90vh; overflow-y: auto; }
    .modal-header { padding: 20px 24px; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; }
    .modal-header h3 { font-size: 18px; }
    .modal-close { background: none; border: none; font-size: 24px; cursor: pointer; color: var(--gray); }
    .modal-body { padding: 24px; }
    .modal-footer { padding: 16px 24px; border-top: 1px solid #e2e8f0; display: flex; justify-content: flex-end; gap: 12px; }

    /* Toast */
    .toast-container { position: fixed; top: 20px; right: 20px; z-index: 2000; }
    .toast { background: white; padding: 16px 20px; border-radius: 8px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); margin-bottom: 10px; display: flex; align-items: center; gap: 12px; animation: slideIn 0.3s ease; }
    .toast.success { border-left: 4px solid var(--success); }
    .toast.error { border-left: 4px solid var(--danger); }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

    /* File Upload */
    .file-upload { border: 2px dashed #e2e8f0; border-radius: 8px; padding: 40px; text-align: center; cursor: pointer; transition: all 0.3s; }
    .file-upload:hover { border-color: var(--primary); background: rgba(99, 102, 241, 0.05); }
    .file-upload i { font-size: 48px; color: var(--gray); margin-bottom: 16px; }
    .file-upload p { color: var(--gray); }
    .file-upload input { display: none; }

    /* Tabs */
    .tabs { display: flex; gap: 4px; margin-bottom: 20px; border-bottom: 2px solid #e2e8f0; }
    .tab { padding: 12px 20px; cursor: pointer; color: var(--gray); font-weight: 500; border-bottom: 2px solid transparent; margin-bottom: -2px; transition: all 0.3s; }
    .tab:hover { color: var(--primary); }
    .tab.active { color: var(--primary); border-bottom-color: var(--primary); }

    /* Search */
    .search-box { position: relative; }
    .search-box input { padding-left: 40px; }
    .search-box i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--gray); }

    /* Grid */
    .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }

    /* Game Card */
    .game-card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    .game-card img { width: 100%; height: 160px; object-fit: cover; }
    .game-card-body { padding: 16px; }
    .game-card-body h4 { margin-bottom: 8px; }
    .game-card-body p { font-size: 14px; color: var(--gray); margin-bottom: 12px; }
    .game-card-actions { display: flex; gap: 8px; }

    /* Loading */
    .loading { display: flex; align-items: center; justify-content: center; padding: 40px; }
    .spinner { width: 40px; height: 40px; border: 3px solid #e2e8f0; border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Environment Editor */
    .env-editor { font-family: monospace; background: #1e293b; color: #e2e8f0; padding: 20px; border-radius: 8px; }
    .env-line { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
    .env-key { color: #f59e0b; min-width: 200px; }
    .env-value { flex: 1; background: rgba(255,255,255,0.1); padding: 8px; border-radius: 4px; border: none; color: white; }
    .env-comment { color: #64748b; font-style: italic; }

    /* Responsive */
    @media (max-width: 768px) {
      .sidebar { transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); }
      .main-content { margin-left: 0; }
      .grid-2, .grid-3 { grid-template-columns: 1fr; }
    }

    /* Utility */
    .hidden { display: none !important; }
    .text-center { text-align: center; }
    .mb-20 { margin-bottom: 20px; }
    .flex { display: flex; }
    .items-center { align-items: center; }
    .justify-between { justify-content: space-between; }
    .gap-10 { gap: 10px; }
  </style>
</head>
<body>
  <div id="app"></div>

  <div class="toast-container" id="toastContainer"></div>

  <script>
    // State Management
    const state = {
      user: null,
      token: localStorage.getItem('adminToken'),
      currentPage: 'dashboard',
      stats: null,
      users: [],
      games: [],
      notifications: [],
      pushNotifications: [],
      settings: {},
      envVars: []
    };

    // API Helper
    const api = {
      baseUrl: '/api',
      async request(endpoint, options = {}) {
        const url = this.baseUrl + endpoint;
        const headers = { 'Content-Type': 'application/json', ...options.headers };
        if (state.token) headers.Authorization = `Bearer ${state.token}`;

        try {
          const response = await fetch(url, { ...options, headers });
          const data = await response.json();
          if (!response.ok) throw new Error(data.message || 'Request failed');
          return data;
        } catch (error) {
          showToast(error.message, 'error');
          throw error;
        }
      },
      get: (endpoint) => api.request(endpoint),
      post: (endpoint, body) => api.request(endpoint, { method: 'POST', body: JSON.stringify(body) }),
      put: (endpoint, body) => api.request(endpoint, { method: 'PUT', body: JSON.stringify(body) }),
      delete: (endpoint) => api.request(endpoint, { method: 'DELETE' }),
      upload: async (endpoint, formData) => {
        const headers = {};
        if (state.token) headers.Authorization = `Bearer ${state.token}`;
        const response = await fetch(api.baseUrl + endpoint, { method: 'POST', headers, body: formData });
        const data = await response.json();
        if (!response.ok) throw new Error(data.message || 'Upload failed');
        return data;
      }
    };

    // Toast Notification
    function showToast(message, type = 'success') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.innerHTML = `<i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'}"></i><span>${message}</span>`;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    // Render Functions
    function render() {
      const app = document.getElementById('app');
      if (!state.token) {
        app.innerHTML = renderLogin();
      } else {
        app.innerHTML = renderApp();
        loadPageData();
      }
      attachEventListeners();
    }

    function renderLogin() {
      return `
        <div class="login-container">
          <div class="login-box">
            <div class="logo"><i class="fas fa-gamepad"></i></div>
            <h1>Admin Login</h1>
            <form id="loginForm">
              <div class="form-group">
                <label>Email</label>
                <input type="email" id="loginEmail" required placeholder="admin@example.com">
              </div>
              <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginPassword" required placeholder="********">
              </div>
              <button type="submit" class="btn btn-primary btn-block">
                <i class="fas fa-sign-in-alt"></i> Login
              </button>
            </form>
          </div>
        </div>
      `;
    }

    function renderApp() {
      return `
        <div class="app-container">
          ${renderSidebar()}
          <main class="main-content">
            <div id="pageContent">${renderPage()}</div>
          </main>
        </div>
        ${renderModals()}
      `;
    }

    function renderSidebar() {
      const navItems = [
        { id: 'dashboard', icon: 'tachometer-alt', label: 'Dashboard' },
        { id: 'games', icon: 'gamepad', label: 'Games' },
        { id: 'users', icon: 'users', label: 'Users' },
        { id: 'notifications', icon: 'bell', label: 'Notifications' },
        { id: 'push', icon: 'paper-plane', label: 'Push Notifications' },
        { id: 'settings', icon: 'cog', label: 'App Settings' },
        { id: 'env', icon: 'file-code', label: 'Environment' }
      ];

      return `
        <aside class="sidebar">
          <div class="sidebar-header">
            <h2><i class="fas fa-gamepad"></i> Admin Panel</h2>
            <p>Manage your games</p>
          </div>
          <nav class="sidebar-nav">
            ${navItems.map(item => `
              <div class="nav-item ${state.currentPage === item.id ? 'active' : ''}" data-page="${item.id}">
                <i class="fas fa-${item.icon}"></i>
                <span>${item.label}</span>
              </div>
            `).join('')}
          </nav>
          <div class="sidebar-footer">
            <div class="nav-item" id="logoutBtn">
              <i class="fas fa-sign-out-alt"></i>
              <span>Logout</span>
            </div>
          </div>
        </aside>
      `;
    }

    function renderPage() {
      switch (state.currentPage) {
        case 'dashboard': return renderDashboard();
        case 'games': return renderGames();
        case 'users': return renderUsers();
        case 'notifications': return renderNotifications();
        case 'push': return renderPushNotifications();
        case 'settings': return renderSettings();
        case 'env': return renderEnv();
        default: return renderDashboard();
      }
    }

    function renderDashboard() {
      const stats = state.stats || { users: {}, games: {}, notifications: {}, recent: { games: [], users: [] } };
      return `
        <div class="page-header">
          <h1>Dashboard</h1>
          <p>Welcome to your admin panel</p>
        </div>
        <div class="stats-grid">
          <div class="stat-card">
            <div class="icon primary"><i class="fas fa-users"></i></div>
            <h4>Total Users</h4>
            <div class="value">${stats.users.total || 0}</div>
          </div>
          <div class="stat-card">
            <div class="icon success"><i class="fas fa-gamepad"></i></div>
            <h4>Total Games</h4>
            <div class="value">${stats.games.total || 0}</div>
          </div>
          <div class="stat-card">
            <div class="icon warning"><i class="fas fa-play"></i></div>
            <h4>Total Plays</h4>
            <div class="value">${stats.games.totalPlays || 0}</div>
          </div>
          <div class="stat-card">
            <div class="icon danger"><i class="fas fa-bell"></i></div>
            <h4>Active Notifications</h4>
            <div class="value">${stats.notifications.active || 0}</div>
          </div>
        </div>
        <div class="grid-2">
          <div class="card">
            <div class="card-header"><h3>Recent Games</h3></div>
            <table>
              <thead><tr><th>Title</th><th>Plays</th><th>Date</th></tr></thead>
              <tbody>
                ${(stats.recent.games || []).map(g => `
                  <tr><td>${g.title}</td><td>${g.plays}</td><td>${new Date(g.created_at).toLocaleDateString()}</td></tr>
                `).join('') || '<tr><td colspan="3" class="text-center">No games yet</td></tr>'}
              </tbody>
            </table>
          </div>
          <div class="card">
            <div class="card-header"><h3>Recent Users</h3></div>
            <table>
              <thead><tr><th>Username</th><th>Email</th><th>Date</th></tr></thead>
              <tbody>
                ${(stats.recent.users || []).map(u => `
                  <tr><td>${u.username}</td><td>${u.email}</td><td>${new Date(u.created_at).toLocaleDateString()}</td></tr>
                `).join('') || '<tr><td colspan="3" class="text-center">No users yet</td></tr>'}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function renderGames() {
      return `
        <div class="page-header flex justify-between items-center">
          <div>
            <h1>Game Management</h1>
            <p>Upload and manage your HTML5 games</p>
          </div>
          <button class="btn btn-primary" onclick="openGameModal()">
            <i class="fas fa-plus"></i> Add Game
          </button>
        </div>
        <div class="card">
          <div class="card-header">
            <div class="search-box">
              <i class="fas fa-search"></i>
              <input type="text" id="gameSearch" placeholder="Search games..." onkeyup="searchGames(this.value)">
            </div>
          </div>
          <div class="table-container">
            <table>
              <thead>
                <tr>
                  <th>Thumbnail</th>
                  <th>Title</th>
                  <th>Category</th>
                  <th>Plays</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="gamesTableBody">
                ${state.games.map(game => `
                  <tr>
                    <td><img src="${game.thumbnail}" width="60" height="40" style="border-radius:4px;object-fit:cover"></td>
                    <td><strong>${game.title}</strong></td>
                    <td><span class="badge badge-primary">${game.category}</span></td>
                    <td>${game.plays || 0}</td>
                    <td>
                      <span class="badge ${game.is_active ? 'badge-success' : 'badge-danger'}">
                        ${game.is_active ? 'Active' : 'Inactive'}
                      </span>
                      ${game.is_featured ? '<span class="badge badge-warning">Featured</span>' : ''}
                    </td>
                    <td>
                      <button class="btn btn-sm btn-secondary" onclick="previewGame(${game.id})"><i class="fas fa-eye"></i></button>
                      <button class="btn btn-sm btn-primary" onclick="editGame(${game.id})"><i class="fas fa-edit"></i></button>
                      <button class="btn btn-sm btn-danger" onclick="deleteGame(${game.id})"><i class="fas fa-trash"></i></button>
                    </td>
                  </tr>
                `).join('') || '<tr><td colspan="6" class="text-center">No games found</td></tr>'}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function renderUsers() {
      return `
        <div class="page-header">
          <h1>User Management</h1>
          <p>Manage platform users</p>
        </div>
        <div class="card">
          <div class="card-header">
            <div class="search-box">
              <i class="fas fa-search"></i>
              <input type="text" id="userSearch" placeholder="Search users..." onkeyup="searchUsers(this.value)">
            </div>
          </div>
          <div class="table-container">
            <table>
              <thead>
                <tr><th>Avatar</th><th>Username</th><th>Email</th><th>Role</th><th>Status</th><th>Actions</th></tr>
              </thead>
              <tbody>
                ${state.users.map(user => `
                  <tr>
                    <td><img src="${user.avatar || 'https://via.placeholder.com/40'}" width="40" height="40" style="border-radius:50%"></td>
                    <td><strong>${user.username}</strong></td>
                    <td>${user.email}</td>
                    <td><span class="badge ${user.role === 'admin' ? 'badge-primary' : 'badge-secondary'}">${user.role}</span></td>
                    <td><span class="badge ${user.is_active ? 'badge-success' : 'badge-danger'}">${user.is_active ? 'Active' : 'Inactive'}</span></td>
                    <td>
                      <button class="btn btn-sm btn-secondary" onclick="toggleUserRole(${user.id}, '${user.role}')">
                        <i class="fas fa-user-shield"></i>
                      </button>
                      <button class="btn btn-sm btn-warning" onclick="toggleUserStatus(${user.id})">
                        <i class="fas fa-${user.is_active ? 'ban' : 'check'}"></i>
                      </button>
                      <button class="btn btn-sm btn-danger" onclick="deleteUser(${user.id})">
                        <i class="fas fa-trash"></i>
                      </button>
                    </td>
                  </tr>
                `).join('') || '<tr><td colspan="6" class="text-center">No users found</td></tr>'}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function renderNotifications() {
      return `
        <div class="page-header flex justify-between items-center">
          <div>
            <h1>In-App Notifications</h1>
            <p>Manage notifications displayed in the app</p>
          </div>
          <button class="btn btn-primary" onclick="openNotificationModal()">
            <i class="fas fa-plus"></i> Create Notification
          </button>
        </div>
        <div class="card">
          <div class="table-container">
            <table>
              <thead>
                <tr><th>Title</th><th>Type</th><th>Target</th><th>Status</th><th>Actions</th></tr>
              </thead>
              <tbody>
                ${state.notifications.map(n => `
                  <tr>
                    <td><strong>${n.title}</strong><br><small>${n.message.substring(0, 50)}...</small></td>
                    <td><span class="badge badge-${n.type === 'error' ? 'danger' : n.type === 'warning' ? 'warning' : 'primary'}">${n.type}</span></td>
                    <td>${n.target_audience}</td>
                    <td><span class="badge ${n.is_active ? 'badge-success' : 'badge-danger'}">${n.is_active ? 'Active' : 'Inactive'}</span></td>
                    <td>
                      <button class="btn btn-sm btn-primary" onclick="editNotification(${n.id})"><i class="fas fa-edit"></i></button>
                      <button class="btn btn-sm btn-danger" onclick="deleteNotification(${n.id})"><i class="fas fa-trash"></i></button>
                    </td>
                  </tr>

    function renderEnv() {
      return `
        <div class="page-header">
          <h1>Environment Variables</h1>
          <p>Manage your server's .env configuration</p>
        </div>
        <div class="card">
          <div class="card-header">
            <h3>Environment Configuration</h3>
            <button class="btn btn-primary" onclick="saveEnvVars()">
              <i class="fas fa-save"></i> Save Changes
            </button>
          </div>
          <div class="env-editor" id="envEditor">
            ${state.envVars.map((item, i) => {
              if (item.type === 'comment') {
                return `<div class="env-line"><span class="env-comment">${item.value}</span></div>`;
              }
              return `
                <div class="env-line">
                  <span class="env-key">${item.key}</span>
                  <span>=</span>
                  <input type="${item.sensitive ? 'password' : 'text'}" class="env-value" data-index="${i}" value="${item.value}">
                </div>
              `;
            }).join('')}
          </div>
          <p style="margin-top:16px;font-size:12px;color:var(--gray)">
            <i class="fas fa-info-circle"></i> Restart the server after making changes to apply them.

        </div>
      `;

              <form id="notificationForm">

                  <label>Title *</label>
                  <input type="text" id="notificationTitle" required>

        <!-- Push Notification Modal -->

    // Event Handlers
    function attachEventListeners() {
      // Login form
      const loginForm = document.getElementById('loginForm');
      if (loginForm) {
        loginForm.addEventListener('submit', async (e) => {
          e.preventDefault();
          const email = document.getElementById('loginEmail').value;
          const password = document.getElementById('loginPassword').value;
          try {
            const data = await api.post('/auth/login', { email, password });
            if (data.user?.role !== 'admin') {
              throw new Error('Access denied. Admin only.');
            }
            state.token = data.token;
            state.user = data.user;
            localStorage.setItem('adminToken', data.token);
            showToast('Login successful!');
            render();
          } catch (error) {}
        });
      }

      // Navigation
      document.querySelectorAll('.nav-item[data-page]').forEach(item => {
        item.addEventListener('click', () => {
          state.currentPage = item.dataset.page;
          document.getElementById('pageContent').innerHTML = renderPage();
          document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
          item.classList.add('active');
          loadPageData();
          attachEventListeners();
        });
      });

      // Logout
      const logoutBtn = document.getElementById('logoutBtn');
      if (logoutBtn) {
        logoutBtn.addEventListener('click', () => {
          state.token = null;
          state.user = null;
          localStorage.removeItem('adminToken');
          render();
        });
      }

      // Settings forms
      const generalForm = document.getElementById('generalSettingsForm');
      if (generalForm) {
        generalForm.addEventListener('submit', async (e) => {
          e.preventDefault();
          await api.put('/admin/settings', {
            settings: {
              app_name: document.getElementById('appName').value,
              app_description: document.getElementById('appDescription').value,
              app_version: document.getElementById('appVersion').value,
              contact_email: document.getElementById('contactEmail').value,
              maintenance_mode: document.getElementById('maintenanceMode').checked
            }
          });
          showToast('Settings saved!');
        });
      }

      const onesignalForm = document.getElementById('onesignalSettingsForm');
      if (onesignalForm) {
        onesignalForm.addEventListener('submit', async (e) => {
          e.preventDefault();
          await api.put('/admin/settings', {
            settings: {
              onesignal_app_id: document.getElementById('onesignalAppId').value,
              onesignal_api_key: document.getElementById('onesignalApiKey').value
            }
          });
          showToast('OneSignal settings saved!');
        });
      }

      const linksForm = document.getElementById('linksSettingsForm');
      if (linksForm) {
        linksForm.addEventListener('submit', async (e) => {
          e.preventDefault();
          await api.put('/admin/settings', {
            settings: {
              privacy_policy_url: document.getElementById('privacyUrl').value,
              terms_url: document.getElementById('termsUrl').value
            }
          });
          showToast('Links saved!');
        });
      }
    }

    // Data Loading
    async function loadPageData() {
      try {
        switch (state.currentPage) {
          case 'dashboard':
            const statsData = await api.get('/admin/stats');
            state.stats = statsData.data;
            document.getElementById('pageContent').innerHTML = renderDashboard();
            break;
          case 'games':
            const gamesData = await api.get('/admin/games');
            state.games = gamesData.data || [];
            document.getElementById('pageContent').innerHTML = renderGames();
            break;
          case 'users':
            const usersData = await api.get('/admin/users');
            state.users = usersData.data || [];
            document.getElementById('pageContent').innerHTML = renderUsers();
            break;
          case 'notifications':
            const notifsData = await api.get('/admin/notifications');
            state.notifications = notifsData.data || [];
            document.getElementById('pageContent').innerHTML = renderNotifications();
            break;
          case 'push':
            const pushData = await api.get('/admin/push-notifications');
            state.pushNotifications = pushData.data || [];
            document.getElementById('pageContent').innerHTML = renderPushNotifications();
            break;
          case 'settings':
            const settingsData = await api.get('/admin/settings');
            state.settings = settingsData.data || {};
            document.getElementById('pageContent').innerHTML = renderSettings();
            attachEventListeners();
            break;
          case 'env':
            const envData = await api.get('/admin/env');
            state.envVars = envData.data || [];
            document.getElementById('pageContent').innerHTML = renderEnv();
            break;
        }
      } catch (error) {
        console.error('Error loading data:', error);
      }
    }

    // Game Functions
    function openGameModal(game = null) {
      document.getElementById('gameModalTitle').textContent = game ? 'Edit Game' : 'Add New Game';
      document.getElementById('gameId').value = game?.id || '';
      document.getElementById('gameTitle').value = game?.title || '';
      document.getElementById('gameDescription').value = game?.description || '';
      document.getElementById('gameCategory').value = game?.category || 'casual';
      document.getElementById('gameDifficulty').value = game?.difficulty || 'medium';
      document.getElementById('gameUrl').value = game?.game_url || '';
      document.getElementById('gameModal').classList.add('active');
    }

    async function editGame(id) {
      const game = state.games.find(g => g.id === id);
      if (game) openGameModal(game);
    }

    async function saveGame() {
      const formData = new FormData();
      formData.append('title', document.getElementById('gameTitle').value);
      formData.append('description', document.getElementById('gameDescription').value);
      formData.append('category', document.getElementById('gameCategory').value);
      formData.append('difficulty', document.getElementById('gameDifficulty').value);
      formData.append('gameUrl', document.getElementById('gameUrl').value);

      const thumbnailFile = document.getElementById('thumbnailFile').files[0];
      const gameFile = document.getElementById('gameFile').files[0];
      if (thumbnailFile) formData.append('thumbnail', thumbnailFile);
      if (gameFile) formData.append('gameFile', gameFile);

      const gameId = document.getElementById('gameId').value;
      try {
        if (gameId) {
          await api.upload(`/admin/games/${gameId}`, formData);
        } else {
          await api.upload('/admin/games', formData);
        }
        showToast('Game saved successfully!');
        closeModal('gameModal');
        loadPageData();
      } catch (error) {}
    }

    async function deleteGame(id) {
      if (!confirm('Are you sure you want to delete this game?')) return;
      await api.delete(`/admin/games/${id}`);
      showToast('Game deleted');
      loadPageData();
    }

    function previewGame(id) {
      const game = state.games.find(g => g.id === id);
      if (game && game.game_url) {
        document.getElementById('gamePreviewFrame').src = game.game_url;
        document.getElementById('previewModal').classList.add('active');
      }
    }

      // Filter games client-side for now
      const tbody = document.getElementById('gamesTableBody');
      const filtered = state.games.filter(g =>
        g.title.toLowerCase().includes(query.toLowerCase())
      );
      // Re-render table would go here
    }

    // User Functions
    async function toggleUserRole(id, currentRole) {
      const newRole = currentRole === 'admin' ? 'user' : 'admin';
      if (!confirm(`Change user role to ${newRole}?`)) return;
      await api.put(`/admin/users/${id}/role`, { role: newRole });
      showToast('User role updated');
      loadPageData();
    }

    async function toggleUserStatus(id) {
      await api.put(`/admin/users/${id}/toggle-active`);
      showToast('User status updated');
      loadPageData();
    }

    async function deleteUser(id) {
      if (!confirm('Are you sure you want to delete this user?')) return;
      await api.delete(`/admin/users/${id}`);
      showToast('User deleted');
      loadPageData();
    }

    function searchUsers(query) {
      // Implement search
    }

    // Notification Functions
    function openNotificationModal(notification = null) {
      document.getElementById('notificationId').value = notification?.id || '';
      document.getElementById('notificationTitle').value = notification?.title || '';
      document.getElementById('notificationMessage').value = notification?.message || '';
      document.getElementById('notificationType').value = notification?.type || 'info';
      document.getElementById('notificationTarget').value = notification?.target_audience || 'all';
      document.getElementById('notificationModal').classList.add('active');
    }

    async function editNotification(id) {
      const notif = state.notifications.find(n => n.id === id);
      if (notif) openNotificationModal(notif);
    }

    async function saveNotification() {
      const id = document.getElementById('notificationId').value;
      const data = {
        title: document.getElementById('notificationTitle').value,
        message: document.getElementById('notificationMessage').value,
        type: document.getElementById('notificationType').value,
        target_audience: document.getElementById('notificationTarget').value
      };

      if (id) {
        await api.put(`/admin/notifications/${id}`, data);
      } else {
        await api.post('/admin/notifications', data);
      }
      showToast('Notification saved');
      closeModal('notificationModal');
      loadPageData();
    }

    async function deleteNotification(id) {
      if (!confirm('Delete this notification?')) return;
      await api.delete(`/admin/notifications/${id}`);
      showToast('Notification deleted');
      loadPageData();
    }

    // Push Notification Functions
    function openPushModal() {
      document.getElementById('pushTitle').value = '';
      document.getElementById('pushMessage').value = '';
      document.getElementById('pushSegment').value = 'All';
      document.getElementById('pushModal').classList.add('active');
    }

    async function sendPushNotification() {
      await api.post('/admin/push-notifications', {
        title: document.getElementById('pushTitle').value,
        message: document.getElementById('pushMessage').value,
        segment: document.getElementById('pushSegment').value
      });
      showToast('Push notification sent!');
      closeModal('pushModal');
      loadPageData();
    }

    // Environment Functions
    async function saveEnvVars() {
      const inputs = document.querySelectorAll('.env-value');
      inputs.forEach(input => {
        const index = parseInt(input.dataset.index);
        if (state.envVars[index] && state.envVars[index].type === 'variable') {
          state.envVars[index].value = input.value;
        }
      });

      await api.put('/admin/env', { variables: state.envVars });
      showToast('Environment variables saved! Restart server to apply.');
    }

    // Modal Functions
    function closeModal(modalId) {
      document.getElementById(modalId).classList.remove('active');
    }

    // Initialize
    render();
  </script>
