version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:6
    container_name: tiktok_games_mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: tiktok_games
    volumes:
      - mongodb_data:/data/db
    networks:
      - tiktok_games_network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tiktok_games_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://admin:password123@mongodb:27017/tiktok_games?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRE: 30d
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      ALLOWED_ORIGINS: "*"
    depends_on:
      - mongodb
    networks:
      - tiktok_games_network
    volumes:
      - ./backend:/app
      - /app/node_modules

  # Redis (Optional - for caching and session management)
  redis:
    image: redis:7-alpine
    container_name: tiktok_games_redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - tiktok_games_network
    volumes:
      - redis_data:/data

volumes:
  mongodb_data:
  redis_data:

networks:
  tiktok_games_network:
    driver: bridge
