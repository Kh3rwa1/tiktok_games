<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - TikTok Games</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* NEO-BRUTALISM DESIGN SYSTEM */
    :root {
      /* Bold Primary Colors */
      --brutal-yellow: #FFE500;
      --brutal-cyan: #00D4FF;
      --brutal-magenta: #FF00FF;
      --brutal-lime: #00FF66;
      --brutal-orange: #FF6600;
      --brutal-pink: #FF69B4;
      --brutal-blue: #0066FF;
      --brutal-red: #FF0033;

      /* Core Colors */
      --brutal-black: #000000;
      --brutal-white: #FFFFFF;
      --brutal-cream: #FFF8E7;
      --brutal-gray: #E5E5E5;

      /* Semantic Colors */
      --success: #00FF66;
      --danger: #FF0033;
      --warning: #FFE500;
      --info: #00D4FF;

      /* Layout */
      --sidebar-width: 280px;
      --header-height: 70px;
      --border-width: 4px;
      --shadow-offset: 6px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Space Mono', 'Courier New', monospace;
      background: var(--brutal-cream);
      min-height: 100vh;
      color: var(--brutal-black);
    }

    /* BRUTAL COMPONENTS */

    /* Login Container */
    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--brutal-yellow);
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    .login-container::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: repeating-linear-gradient(
        45deg,
        transparent,
        transparent 10px,
        rgba(0,0,0,0.03) 10px,
        rgba(0,0,0,0.03) 20px
      );
    }

    .login-box {
      background: var(--brutal-white);
      border: var(--border-width) solid var(--brutal-black);
      box-shadow: var(--shadow-offset) var(--shadow-offset) 0 var(--brutal-black);
      padding: 48px;
      width: 100%;
      max-width: 440px;
      position: relative;
      transform: rotate(-1deg);
    }

    .login-box h1 {
      text-align: center;
      color: var(--brutal-black);
      margin-bottom: 8px;
      font-size: 28px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .login-box p {
      text-align: center;
      color: var(--brutal-black);
      margin-bottom: 36px;
      font-size: 14px;
      font-weight: 500;
    }

    /* Form Elements */
    .form-group { margin-bottom: 24px; }

    .form-group label {
      display: block;
      margin-bottom: 10px;
      font-weight: 700;
      color: var(--brutal-black);
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 14px 18px;
      border: 3px solid var(--brutal-black);
      background: var(--brutal-white);
      font-size: 14px;
      font-family: inherit;
      font-weight: 500;
      transition: all 0.15s ease;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      outline: none;
      background: var(--brutal-yellow);
      box-shadow: 4px 4px 0 var(--brutal-black);
      transform: translate(-2px, -2px);
    }

    .form-group input::placeholder {
      color: #666;
      font-weight: 400;
    }

    /* File Upload Area */
    .file-upload-area {
      border: 3px dashed var(--brutal-black);
      background: var(--brutal-gray);
      padding: 32px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .file-upload-area:hover {
      background: var(--brutal-yellow);
      transform: translate(-2px, -2px);
      box-shadow: 4px 4px 0 var(--brutal-black);
    }

    .file-upload-area i {
      font-size: 32px;
      margin-bottom: 12px;
      display: block;
    }

    .file-upload-area p {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
    }

    .file-upload-area.has-file {
      border-color: var(--success);
      background: rgba(0, 255, 102, 0.2);
    }

    .file-upload-area.has-file i {
      color: var(--success);
    }

    /* Buttons - Neo Brutalist Style */
    .btn {
      padding: 14px 28px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.15s ease;
      border: 3px solid var(--brutal-black);
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-family: inherit;
      position: relative;
    }

    .btn:hover {
      transform: translate(-3px, -3px);
      box-shadow: 6px 6px 0 var(--brutal-black);
    }

    .btn:active {
      transform: translate(0, 0);
      box-shadow: none;
    }

    .btn-primary {
      background: var(--brutal-yellow);
      color: var(--brutal-black);
      box-shadow: 4px 4px 0 var(--brutal-black);
    }

    .btn-secondary {
      background: var(--brutal-gray);
      color: var(--brutal-black);
      box-shadow: 4px 4px 0 var(--brutal-black);
    }

    .btn-success {
      background: var(--brutal-lime);
      color: var(--brutal-black);
      box-shadow: 4px 4px 0 var(--brutal-black);
    }

    .btn-danger {
      background: var(--brutal-red);
      color: var(--brutal-white);
      box-shadow: 4px 4px 0 var(--brutal-black);
    }

    .btn-info {
      background: var(--brutal-cyan);
      color: var(--brutal-black);
      box-shadow: 4px 4px 0 var(--brutal-black);
    }

    .btn-outline {
      background: transparent;
      color: var(--brutal-black);
      box-shadow: 4px 4px 0 var(--brutal-black);
    }

    .btn-outline:hover {
      background: var(--brutal-yellow);
    }

    .btn-sm {
      padding: 10px 18px;
      font-size: 12px;
    }

    .btn-block {
      width: 100%;
      justify-content: center;
    }

    /* App Container */
    .app-container { display: flex; min-height: 100vh; }

    /* Sidebar - Neo Brutalist */
    .sidebar {
      width: var(--sidebar-width);
      background: var(--brutal-black);
      color: var(--brutal-white);
      position: fixed;
      height: 100vh;
      overflow-y: auto;
      z-index: 1000;
      transition: transform 0.3s;
      border-right: var(--border-width) solid var(--brutal-black);
    }

    .sidebar-header {
      padding: 24px;
      border-bottom: 3px solid var(--brutal-white);
      background: var(--brutal-magenta);
      color: var(--brutal-black);
    }

    .sidebar-header h2 {
      font-size: 18px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .sidebar-header span {
      font-size: 11px;
      color: var(--brutal-black);
      font-weight: 700;
      background: var(--brutal-yellow);
      padding: 2px 8px;
      display: inline-block;
      margin-top: 8px;
      border: 2px solid var(--brutal-black);
    }

    .sidebar-nav { padding: 20px 0; }

    .nav-section {
      padding: 12px 24px;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--brutal-gray);
      margin-top: 16px;
      font-weight: 700;
    }

    .nav-item {
      display: flex;
      align-items: center;
      padding: 14px 24px;
      color: var(--brutal-white);
      text-decoration: none;
      transition: all 0.15s ease;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-left: 4px solid transparent;
    }

    .nav-item:hover {
      background: var(--brutal-cyan);
      color: var(--brutal-black);
      border-left-color: var(--brutal-yellow);
    }

    .nav-item.active {
      background: var(--brutal-yellow);
      color: var(--brutal-black);
      border-left-color: var(--brutal-magenta);
    }

    .nav-item i {
      width: 24px;
      margin-right: 14px;
      font-size: 16px;
    }

    /* Main Content */
    .main-content {
      flex: 1;
      margin-left: var(--sidebar-width);
      min-height: 100vh;
      background: var(--brutal-cream);
    }

    /* Header - Neo Brutalist */
    .header {
      height: var(--header-height);
      background: var(--brutal-white);
      border-bottom: var(--border-width) solid var(--brutal-black);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header h1 {
      font-size: 22px;
      color: var(--brutal-black);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      padding: 8px 16px;
      border: 3px solid var(--brutal-black);
      background: var(--brutal-lime);
      transition: all 0.15s ease;
    }

    .user-info:hover {
      transform: translate(-2px, -2px);
      box-shadow: 4px 4px 0 var(--brutal-black);
    }

    .user-avatar {
      width: 36px;
      height: 36px;
      background: var(--brutal-black);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--brutal-white);
      font-weight: 900;
      font-size: 14px;
    }

    .user-info span {
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-size: 12px;
    }

    /* Content Area */
    .content { padding: 28px; }

    /* Cards - Neo Brutalist */
    .card {
      background: var(--brutal-white);
      border: var(--border-width) solid var(--brutal-black);
      box-shadow: var(--shadow-offset) var(--shadow-offset) 0 var(--brutal-black);
      margin-bottom: 28px;
    }

    .card-header {
      padding: 20px 24px;
      border-bottom: 3px solid var(--brutal-black);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--brutal-cyan);
    }

    .card-header h3 {
      font-size: 16px;
      color: var(--brutal-black);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .card-body { padding: 24px; }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 24px;
      margin-bottom: 28px;
    }

    .stat-card {
      background: var(--brutal-white);
      border: var(--border-width) solid var(--brutal-black);
      box-shadow: var(--shadow-offset) var(--shadow-offset) 0 var(--brutal-black);
      padding: 24px;
      position: relative;
      transition: all 0.15s ease;
    }

    .stat-card:hover {
      transform: translate(-3px, -3px);
      box-shadow: 9px 9px 0 var(--brutal-black);
    }

    .stat-card:nth-child(1) { transform: rotate(-1deg); }
    .stat-card:nth-child(2) { transform: rotate(0.5deg); }
    .stat-card:nth-child(3) { transform: rotate(-0.5deg); }
    .stat-card:nth-child(4) { transform: rotate(1deg); }

    .stat-card:nth-child(1):hover { transform: rotate(-1deg) translate(-3px, -3px); }
    .stat-card:nth-child(2):hover { transform: rotate(0.5deg) translate(-3px, -3px); }
    .stat-card:nth-child(3):hover { transform: rotate(-0.5deg) translate(-3px, -3px); }
    .stat-card:nth-child(4):hover { transform: rotate(1deg) translate(-3px, -3px); }

    .stat-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .stat-card-icon {
      width: 52px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      border: 3px solid var(--brutal-black);
    }

    .stat-card-icon.primary { background: var(--brutal-magenta); color: var(--brutal-black); }
    .stat-card-icon.success { background: var(--brutal-lime); color: var(--brutal-black); }
    .stat-card-icon.warning { background: var(--brutal-yellow); color: var(--brutal-black); }
    .stat-card-icon.info { background: var(--brutal-cyan); color: var(--brutal-black); }

    .stat-card h4 {
      font-size: 11px;
      color: var(--brutal-black);
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .stat-card .value {
      font-size: 36px;
      font-weight: 900;
      color: var(--brutal-black);
    }

    /* Tables - Neo Brutalist */
    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 14px 18px;
      text-align: left;
      border-bottom: 3px solid var(--brutal-black);
    }

    th {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--brutal-black);
      font-weight: 900;
      background: var(--brutal-yellow);
      border-bottom: 3px solid var(--brutal-black);
    }

    td {
      font-size: 13px;
      color: var(--brutal-black);
      font-weight: 500;
    }

    tr:hover { background: var(--brutal-cream); }

    tbody tr:last-child td {
      border-bottom: none;
    }

    /* Badges - Neo Brutalist */
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 6px 12px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      border: 2px solid var(--brutal-black);
    }

    .badge-success { background: var(--brutal-lime); color: var(--brutal-black); }
    .badge-danger { background: var(--brutal-red); color: var(--brutal-white); }
    .badge-warning { background: var(--brutal-yellow); color: var(--brutal-black); }
    .badge-info { background: var(--brutal-cyan); color: var(--brutal-black); }
    .badge-primary { background: var(--brutal-magenta); color: var(--brutal-black); }

    /* Search Bar */
    .search-bar {
      display: flex;
      gap: 16px;
      margin-bottom: 24px;
    }

    .search-input {
      flex: 1;
      position: relative;
    }

    .search-input input {
      width: 100%;
      padding: 12px 18px 12px 48px;
      border: 3px solid var(--brutal-black);
      background: var(--brutal-white);
      font-size: 14px;
      font-family: inherit;
      font-weight: 500;
    }

    .search-input input:focus {
      outline: none;
      background: var(--brutal-yellow);
      box-shadow: 4px 4px 0 var(--brutal-black);
    }

    .search-input i {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--brutal-black);
      font-size: 16px;
    }

    /* Toast Notifications */
    .toast-container {
      position: fixed;
      top: 24px;
      right: 24px;
      z-index: 3000;
    }

    .toast {
      background: var(--brutal-white);
      border: 3px solid var(--brutal-black);
      box-shadow: var(--shadow-offset) var(--shadow-offset) 0 var(--brutal-black);
      padding: 18px 22px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 14px;
      animation: slideIn 0.3s ease;
      min-width: 320px;
      font-weight: 600;
    }

    @keyframes slideIn {
      from { transform: translateX(120%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    .toast.success {
      border-left: 8px solid var(--brutal-lime);
      background: var(--brutal-lime);
    }

    .toast.error {
      border-left: 8px solid var(--brutal-red);
      background: var(--brutal-red);
      color: var(--brutal-white);
    }

    .toast.info {
      border-left: 8px solid var(--brutal-cyan);
      background: var(--brutal-cyan);
    }

    /* Tabs - Neo Brutalist */
    .tabs {
      display: flex;
      border-bottom: 4px solid var(--brutal-black);
      margin-bottom: 28px;
      background: var(--brutal-white);
    }

    .tab {
      padding: 16px 24px;
      font-size: 12px;
      font-weight: 700;
      color: var(--brutal-black);
      cursor: pointer;
      border: none;
      border-right: 3px solid var(--brutal-black);
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.15s ease;
      background: var(--brutal-white);
    }

    .tab:hover { background: var(--brutal-cream); }

    .tab.active {
      background: var(--brutal-yellow);
      color: var(--brutal-black);
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Settings Sections */
    .settings-section { margin-bottom: 36px; }

    .settings-section h4 {
      font-size: 14px;
      color: var(--brutal-black);
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 3px solid var(--brutal-black);
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 900;
    }

    .settings-group {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 24px;
    }

    .setting-item {
      background: var(--brutal-white);
      padding: 20px;
      border: 3px solid var(--brutal-black);
      box-shadow: 4px 4px 0 var(--brutal-black);
    }

    .setting-item label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--brutal-black);
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .setting-item .help-text {
      font-size: 10px;
      color: #666;
      margin-top: 8px;
      font-weight: 500;
    }

    /* Toggle Switch - Neo Brutalist */
    .toggle {
      position: relative;
      display: inline-block;
      width: 56px;
      height: 30px;
    }

    .toggle input { opacity: 0; width: 0; height: 0; }

    .toggle-slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--brutal-gray);
      border: 3px solid var(--brutal-black);
      transition: 0.2s;
    }

    .toggle-slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 4px;
      bottom: 3px;
      background: var(--brutal-black);
      transition: 0.2s;
    }

    .toggle input:checked + .toggle-slider { background: var(--brutal-lime); }
    .toggle input:checked + .toggle-slider:before { transform: translateX(24px); }

    /* Action Buttons */
    .action-btns { display: flex; gap: 10px; }

    .action-btn {
      padding: 8px 12px;
      border: 2px solid var(--brutal-black);
      cursor: pointer;
      font-size: 12px;
      transition: all 0.15s ease;
      font-weight: 700;
    }

    .action-btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 3px 3px 0 var(--brutal-black);
    }

    .action-btn.edit { background: var(--brutal-cyan); color: var(--brutal-black); }
    .action-btn.delete { background: var(--brutal-red); color: var(--brutal-white); }
    .action-btn.toggle { background: var(--brutal-yellow); color: var(--brutal-black); }

    /* Loading State */
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid var(--brutal-black);
      border-top-color: var(--brutal-yellow);
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Grid Layouts */
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 24px;
    }

    /* Modal - Neo Brutalist */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      padding: 20px;
    }

    .modal {
      background: var(--brutal-white);
      border: var(--border-width) solid var(--brutal-black);
      box-shadow: 8px 8px 0 var(--brutal-black);
      width: 100%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-header {
      padding: 20px 24px;
      border-bottom: 3px solid var(--brutal-black);
      background: var(--brutal-magenta);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header h3 {
      font-size: 16px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .modal-close {
      background: var(--brutal-black);
      color: var(--brutal-white);
      border: none;
      width: 32px;
      height: 32px;
      cursor: pointer;
      font-size: 18px;
      font-weight: 700;
    }

    .modal-body { padding: 24px; }

    .modal-footer {
      padding: 16px 24px;
      border-top: 3px solid var(--brutal-black);
      display: flex;
      gap: 12px;
      justify-content: flex-end;
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--brutal-black);
    }

    .empty-state i {
      font-size: 56px;
      margin-bottom: 20px;
      opacity: 0.3;
    }

    .empty-state p {
      font-size: 14px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Game Thumbnail */
    .game-thumb {
      width: 48px;
      height: 48px;
      object-fit: cover;
      border: 2px solid var(--brutal-black);
    }

    /* User Avatar in Table */
    .table-avatar {
      width: 36px;
      height: 36px;
      background: var(--brutal-black);
      color: var(--brutal-white);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 12px;
    }

    /* Responsive Design */
    @media (max-width: 1024px) {
      .sidebar { transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); }
      .main-content { margin-left: 0; }
      .grid-2 { grid-template-columns: 1fr; }
      .stats-grid { grid-template-columns: 1fr; }
      .stat-card { transform: none !important; }
      .stat-card:hover { transform: translate(-3px, -3px) !important; }
    }

    /* Scrollbar Styling */
    ::-webkit-scrollbar { width: 12px; }
    ::-webkit-scrollbar-track { background: var(--brutal-cream); }
    ::-webkit-scrollbar-thumb {
      background: var(--brutal-black);
      border: 3px solid var(--brutal-cream);
    }

    /* Selection */
    ::selection {
      background: var(--brutal-yellow);
      color: var(--brutal-black);
    }

    /* Confirmation Dialog */
    .confirm-dialog {
      text-align: center;
      padding: 20px;
    }

    .confirm-dialog i {
      font-size: 48px;
      margin-bottom: 16px;
      color: var(--brutal-red);
    }

    .confirm-dialog p {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 24px;
    }

    .confirm-dialog .btn-group {
      display: flex;
      gap: 12px;
      justify-content: center;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div class="toast-container" id="toastContainer"></div>
  <div id="modalContainer"></div>

  <script>
    // ==================== STATE MANAGEMENT ====================
    const state = {
      user: null,
      token: localStorage.getItem('adminToken'),
      currentPage: 'dashboard',
      stats: null,
      users: [],
      games: [],
      notifications: [],
      settings: {},
      loading: false,
      errors: {},
      lastSync: null,
      syncInterval: null,
      isOnline: navigator.onLine
    };

    // ==================== AUTO-SYNC SYSTEM ====================
    const SYNC_INTERVAL = 30000; // 30 seconds

    const startAutoSync = () => {
      if (state.syncInterval) return;

      state.syncInterval = setInterval(async () => {
        if (!state.token || !state.user) return;

        try {
          // Silently refresh current page data
          await refreshCurrentPageData();
        } catch (error) {
          console.log('Auto-sync failed:', error.message);
        }
      }, SYNC_INTERVAL);

      // Listen for online/offline events
      window.addEventListener('online', handleOnline);
      window.addEventListener('offline', handleOffline);
    };

    const stopAutoSync = () => {
      if (state.syncInterval) {
        clearInterval(state.syncInterval);
        state.syncInterval = null;
      }
      window.removeEventListener('online', handleOnline);
      window.removeEventListener('offline', handleOffline);
    };

    const handleOnline = () => {
      state.isOnline = true;
      showToast('Connection restored', 'success');
      refreshCurrentPageData();
    };

    const handleOffline = () => {
      state.isOnline = false;
      showToast('You are offline', 'error');
    };

    const refreshCurrentPageData = async () => {
      if (!state.isOnline) return;

      // Don't set loading state for background sync
      try {
        switch (state.currentPage) {
          case 'dashboard':
            const statsData = await api('/admin/stats');
            if (JSON.stringify(state.stats) !== JSON.stringify(statsData.data)) {
              state.stats = statsData.data;
              state.lastSync = new Date().toISOString();
              render();
            }
            break;
          case 'users':
            const search = document.getElementById('userSearch')?.value || '';
            const usersData = await api(`/admin/users?search=${encodeURIComponent(search)}`);
            if (JSON.stringify(state.users) !== JSON.stringify(usersData.data)) {
              state.users = usersData.data || [];
              state.lastSync = new Date().toISOString();
              render();
            }
            break;
          case 'games':
            const gameSearch = document.getElementById('gameSearch')?.value || '';
            const gamesData = await api(`/admin/games?search=${encodeURIComponent(gameSearch)}`);
            if (JSON.stringify(state.games) !== JSON.stringify(gamesData.data)) {
              state.games = gamesData.data || [];
              state.lastSync = new Date().toISOString();
              render();
            }
            break;
          case 'notifications':
            const notifsData = await api('/admin/notifications');
            if (JSON.stringify(state.notifications) !== JSON.stringify(notifsData.data)) {
              state.notifications = notifsData.data || [];
              state.lastSync = new Date().toISOString();
              render();
            }
            break;
        }
      } catch (error) {
        // Silent fail for background sync
        console.log('Background sync error:', error.message);
      }
    };

    // ==================== API LAYER ====================
    const api = async (endpoint, options = {}) => {
      const headers = { ...options.headers };

      if (!(options.body instanceof FormData)) {
        headers['Content-Type'] = 'application/json';
      }

      if (state.token) {
        headers['Authorization'] = `Bearer ${state.token}`;
      }

      try {
        const response = await fetch(`/api${endpoint}`, { ...options, headers });
        const data = await response.json();

        if (!response.ok) {
          const error = new Error(data.message || data.error || 'Request failed');
          error.status = response.status;
          error.data = data;
          throw error;
        }

        return data;
      } catch (error) {
        if (error.status === 401) {
          handleLogout();
          showToast('Session expired. Please login again.', 'error');
        }
        throw error;
      }
    };

    // ==================== TOAST NOTIFICATIONS ====================
    const showToast = (message, type = 'success') => {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;

      const icons = {
        success: 'check-circle',
        error: 'exclamation-triangle',
        info: 'info-circle'
      };

      toast.innerHTML = `
        <i class="fas fa-${icons[type] || 'info-circle'}"></i>
        <span>${escapeHtml(message)}</span>
      `;

      container.appendChild(toast);
      setTimeout(() => {
        toast.style.animation = 'slideIn 0.3s ease reverse';
        setTimeout(() => toast.remove(), 300);
      }, 4000);
    };

    // ==================== MODAL SYSTEM ====================
    const showModal = (title, content, footer = '') => {
      const container = document.getElementById('modalContainer');
      container.innerHTML = `
        <div class="modal-overlay" onclick="closeModal(event)">
          <div class="modal" onclick="event.stopPropagation()">
            <div class="modal-header">
              <h3>${escapeHtml(title)}</h3>
              <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">${content}</div>
            ${footer ? `<div class="modal-footer">${footer}</div>` : ''}
          </div>
        </div>
      `;
    };

    const closeModal = (event) => {
      if (!event || event.target.classList.contains('modal-overlay')) {
        document.getElementById('modalContainer').innerHTML = '';
      }
    };

    const showConfirm = (message, onConfirm) => {
      const content = `
        <div class="confirm-dialog">
          <i class="fas fa-exclamation-triangle"></i>
          <p>${escapeHtml(message)}</p>
          <div class="btn-group">
            <button class="btn btn-secondary btn-sm" onclick="closeModal()">Cancel</button>
            <button class="btn btn-danger btn-sm" onclick="(${onConfirm.toString()})(); closeModal();">Confirm</button>
          </div>
        </div>
      `;
      showModal('Confirm Action', content);
    };

    // ==================== SECURITY HELPERS ====================
    const escapeHtml = (str) => {
      if (!str) return '';
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    };

    // ==================== RENDER FUNCTIONS ====================
    const render = () => {
      const app = document.getElementById('app');
      if (!state.token || !state.user) {
        app.innerHTML = renderLogin();
        return;
      }
      app.innerHTML = renderApp();
      loadPageData();
    };

    const renderLogin = () => `
      <div class="login-container">
        <div class="login-box">
          <h1><i class="fas fa-gamepad"></i> Admin</h1>
          <p>Manage your TikTok Games platform</p>
          <form onsubmit="handleLogin(event)">
            <div class="form-group">
              <label>Email</label>
              <input type="email" id="loginEmail" required placeholder="admin@example.com" autocomplete="email">
            </div>
            <div class="form-group">
              <label>Password</label>
              <input type="password" id="loginPassword" required placeholder="Enter password" autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary btn-block">
              <i class="fas fa-sign-in-alt"></i> Sign In
            </button>
          </form>
          <div style="text-align: center; margin-top: 28px;">
            <button onclick="showSetup()" class="btn btn-outline btn-sm">First Time Setup</button>
          </div>
        </div>
      </div>
    `;

    const renderApp = () => `
      <div class="app-container">
        <aside class="sidebar" id="sidebar">
          <div class="sidebar-header">
            <h2><i class="fas fa-gamepad"></i> TikTok Games</h2>
            <span>v4.0 ADMIN</span>
          </div>
          <nav class="sidebar-nav">
            <div class="nav-section">Main</div>
            <a class="nav-item ${state.currentPage === 'dashboard' ? 'active' : ''}" onclick="navigate('dashboard')">
              <i class="fas fa-chart-pie"></i> Dashboard
            </a>
            <div class="nav-section">Management</div>
            <a class="nav-item ${state.currentPage === 'users' ? 'active' : ''}" onclick="navigate('users')">
              <i class="fas fa-users"></i> Users
            </a>
            <a class="nav-item ${state.currentPage === 'games' ? 'active' : ''}" onclick="navigate('games')">
              <i class="fas fa-gamepad"></i> Games
            </a>
            <a class="nav-item ${state.currentPage === 'notifications' ? 'active' : ''}" onclick="navigate('notifications')">
              <i class="fas fa-bell"></i> Notifications
            </a>
            <div class="nav-section">System</div>
            <a class="nav-item ${state.currentPage === 'settings' ? 'active' : ''}" onclick="navigate('settings')">
              <i class="fas fa-cog"></i> Settings
            </a>
          </nav>
        </aside>
        <main class="main-content">
          <header class="header">
            <h1>${{
              dashboard: 'Dashboard',
              users: 'User Management',
              games: 'Game Management',
              notifications: 'Notifications',
              settings: 'Settings'
            }[state.currentPage]}</h1>
            <div class="user-info" onclick="handleLogout()">
              <div class="user-avatar">${state.user?.username?.charAt(0).toUpperCase() || 'A'}</div>
              <span>${escapeHtml(state.user?.username || 'Admin')}</span>
              <i class="fas fa-sign-out-alt"></i>
            </div>
          </header>
          <div class="content">${renderPageContent()}</div>
        </main>
      </div>
    `;

    const renderPageContent = () => {
      if (state.loading) {
        return '<div class="loading"><div class="spinner"></div></div>';
      }

      switch (state.currentPage) {
        case 'dashboard': return renderDashboard();
        case 'users': return renderUsers();
        case 'games': return renderGames();
        case 'notifications': return renderNotifications();
        case 'settings': return renderSettings();
        default: return renderDashboard();
      }
    };

    const renderDashboard = () => `
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-card-header">
            <div>
              <h4>Total Users</h4>
              <div class="value">${state.stats?.users?.total?.toLocaleString() || 0}</div>
            </div>
            <div class="stat-card-icon primary"><i class="fas fa-users"></i></div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-card-header">
            <div>
              <h4>Total Games</h4>
              <div class="value">${state.stats?.games?.total?.toLocaleString() || 0}</div>
            </div>
            <div class="stat-card-icon success"><i class="fas fa-gamepad"></i></div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-card-header">
            <div>
              <h4>Total Plays</h4>
              <div class="value">${state.stats?.games?.totalPlays?.toLocaleString() || 0}</div>
            </div>
            <div class="stat-card-icon warning"><i class="fas fa-play"></i></div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-card-header">
            <div>
              <h4>Active Notifs</h4>
              <div class="value">${state.stats?.notifications?.active?.toLocaleString() || 0}</div>
            </div>
            <div class="stat-card-icon info"><i class="fas fa-bell"></i></div>
          </div>
        </div>
      </div>
      <div class="grid-2">
        <div class="card">
          <div class="card-header"><h3>Recent Games</h3></div>
          <div class="card-body">
            ${state.stats?.recent?.games?.length ? `
              <table>
                <thead>
                  <tr>
                    <th>Title</th>
                    <th>Plays</th>
                    <th>Date</th>
                  </tr>
                </thead>
                <tbody>
                  ${state.stats.recent.games.map(g => `
                    <tr>
                      <td><strong>${escapeHtml(g.title)}</strong></td>
                      <td>${g.plays?.toLocaleString() || 0}</td>
                      <td>${new Date(g.created_at).toLocaleDateString()}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            ` : '<div class="empty-state"><i class="fas fa-gamepad"></i><p>No games yet</p></div>'}
          </div>
        </div>
        <div class="card">
          <div class="card-header"><h3>Recent Users</h3></div>
          <div class="card-body">
            ${state.stats?.recent?.users?.length ? `
              <table>
                <thead>
                  <tr>
                    <th>Username</th>
                    <th>Email</th>
                    <th>Joined</th>
                  </tr>
                </thead>
                <tbody>
                  ${state.stats.recent.users.map(u => `
                    <tr>
                      <td><strong>${escapeHtml(u.username)}</strong></td>
                      <td>${escapeHtml(u.email)}</td>
                      <td>${new Date(u.created_at).toLocaleDateString()}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            ` : '<div class="empty-state"><i class="fas fa-users"></i><p>No users yet</p></div>'}
          </div>
        </div>
      </div>
    `;

    const renderUsers = () => `
      <div class="card">
        <div class="card-header">
          <h3>All Users</h3>
        </div>
        <div class="card-body">
          <div class="search-bar">
            <div class="search-input">
              <i class="fas fa-search"></i>
              <input type="text" placeholder="Search users..." id="userSearch" onkeyup="debouncedLoadUsers()">
            </div>
          </div>
          <table>
            <thead>
              <tr>
                <th>User</th>
                <th>Email</th>
                <th>Role</th>
                <th>Status</th>
                <th>Joined</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              ${state.users.length ? state.users.map(u => `
                <tr>
                  <td>
                    <div style="display:flex;align-items:center;gap:12px;">
                      <div class="table-avatar">${escapeHtml(u.username.charAt(0).toUpperCase())}</div>
                      <strong>${escapeHtml(u.username)}</strong>
                    </div>
                  </td>
                  <td>${escapeHtml(u.email)}</td>
                  <td>
                    <span class="badge ${u.role === 'admin' ? 'badge-primary' : 'badge-info'}">
                      ${escapeHtml(u.role)}
                    </span>
                  </td>
                  <td>
                    <span class="badge ${u.is_active ? 'badge-success' : 'badge-danger'}">
                      ${u.is_active ? 'Active' : 'Inactive'}
                    </span>
                  </td>
                  <td>${new Date(u.created_at).toLocaleDateString()}</td>
                  <td>
                    <div class="action-btns">
                      <button class="action-btn toggle" onclick="toggleUserStatus(${u.id})" title="${u.is_active ? 'Deactivate' : 'Activate'}">
                        <i class="fas fa-${u.is_active ? 'ban' : 'check'}"></i>
                      </button>
                      <button class="action-btn edit" onclick="changeUserRole(${u.id}, '${u.role}')" title="Change role">
                        <i class="fas fa-user-shield"></i>
                      </button>
                      <button class="action-btn delete" onclick="confirmDeleteUser(${u.id}, '${escapeHtml(u.username)}')" title="Delete">
                        <i class="fas fa-trash"></i>
                      </button>
                    </div>
                  </td>
                </tr>
              `).join('') : '<tr><td colspan="6"><div class="empty-state"><i class="fas fa-users"></i><p>No users found</p></div></td></tr>'}
            </tbody>
          </table>
        </div>
      </div>
    `;

    const renderGames = () => `
      <div class="card">
        <div class="card-header">
          <h3>All Games</h3>
          <button onclick="showGameModal()" class="btn btn-primary btn-sm">
            <i class="fas fa-plus"></i> Add Game
          </button>
        </div>
        <div class="card-body">
          <div class="search-bar">
            <div class="search-input">
              <i class="fas fa-search"></i>
              <input type="text" placeholder="Search games..." id="gameSearch" onkeyup="debouncedLoadGames()">
            </div>
          </div>
          <table>
            <thead>
              <tr>
                <th>Game</th>
                <th>Category</th>
                <th>Plays</th>
                <th>Rating</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              ${state.games.length ? state.games.map(g => `
                <tr>
                  <td>
                    <div style="display:flex;align-items:center;gap:12px;">
                      <img src="${escapeHtml(g.thumbnail || '/placeholder.png')}" class="game-thumb" alt="${escapeHtml(g.title)}">
                      <div>
                        <strong>${escapeHtml(g.title)}</strong>
                        ${g.is_featured ? '<br><span class="badge badge-warning" style="font-size:9px;margin-top:4px;">Featured</span>' : ''}
                      </div>
                    </div>
                  </td>
                  <td><span class="badge badge-info">${escapeHtml(g.category || 'N/A')}</span></td>
                  <td>${g.plays?.toLocaleString() || 0}</td>
                  <td>
                    ${g.average_rating ? g.average_rating.toFixed(1) : '-'}
                    <i class="fas fa-star" style="color:var(--brutal-yellow);font-size:11px;"></i>
                  </td>
                  <td>
                    <span class="badge ${g.is_active ? 'badge-success' : 'badge-danger'}">
                      ${g.is_active ? 'Active' : 'Inactive'}
                    </span>
                  </td>
                  <td>
                    <div class="action-btns">
                      <button class="action-btn toggle" onclick="toggleGameActive(${g.id})" title="${g.is_active ? 'Deactivate' : 'Activate'}">
                        <i class="fas fa-power-off"></i>
                      </button>
                      <button class="action-btn toggle" onclick="toggleGameFeatured(${g.id})" title="${g.is_featured ? 'Unfeature' : 'Feature'}">
                        <i class="fas fa-star"></i>
                      </button>
                      <button class="action-btn delete" onclick="confirmDeleteGame(${g.id}, '${escapeHtml(g.title)}')" title="Delete">
                        <i class="fas fa-trash"></i>
                      </button>
                    </div>
                  </td>
                </tr>
              `).join('') : '<tr><td colspan="6"><div class="empty-state"><i class="fas fa-gamepad"></i><p>No games found</p></div></td></tr>'}
            </tbody>
          </table>
        </div>
      </div>
    `;

    const renderNotifications = () => `
      <div class="tabs">
        <div class="tab active" onclick="switchNotificationTab('inapp', this)">In-App</div>
        <div class="tab" onclick="switchNotificationTab('push', this)">Push</div>
      </div>
      <div id="inappNotifications" class="tab-content active">
        <div class="card">
          <div class="card-header">
            <h3>In-App Notifications</h3>
            <button onclick="showNotificationModal()" class="btn btn-primary btn-sm">
              <i class="fas fa-plus"></i> Create
            </button>
          </div>
          <div class="card-body">
            <table>
              <thead>
                <tr>
                  <th>Title</th>
                  <th>Type</th>
                  <th>Audience</th>
                  <th>Status</th>
                  <th>Created</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>
                ${state.notifications.length ? state.notifications.map(n => `
                  <tr>
                    <td><strong>${escapeHtml(n.title)}</strong></td>
                    <td>
                      <span class="badge badge-${n.type === 'error' ? 'danger' : n.type === 'warning' ? 'warning' : 'info'}">
                        ${escapeHtml(n.type)}
                      </span>
                    </td>
                    <td>${escapeHtml(n.target_audience)}</td>
                    <td>
                      <span class="badge ${n.is_active ? 'badge-success' : 'badge-danger'}">
                        ${n.is_active ? 'Active' : 'Inactive'}
                      </span>
                    </td>
                    <td>${new Date(n.created_at).toLocaleDateString()}</td>
                    <td>
                      <div class="action-btns">
                        <button class="action-btn delete" onclick="confirmDeleteNotification(${n.id})" title="Delete">
                          <i class="fas fa-trash"></i>
                        </button>
                      </div>
                    </td>
                  </tr>
                `).join('') : '<tr><td colspan="6"><div class="empty-state"><i class="fas fa-bell"></i><p>No notifications</p></div></td></tr>'}
              </tbody>
            </table>
          </div>
        </div>
      </div>
      <div id="pushNotifications" class="tab-content">
        <div class="card">
          <div class="card-header">
            <h3>Send Push Notification</h3>
          </div>
          <div class="card-body">
            <form onsubmit="sendPushNotification(event)">
              <div class="form-group">
                <label>Title</label>
                <input type="text" id="pushTitle" required placeholder="Notification title">
              </div>
              <div class="form-group">
                <label>Message</label>
                <textarea id="pushMessage" required placeholder="Notification message" rows="4"></textarea>
              </div>
              <div class="form-group">
                <label>Segment</label>
                <select id="pushSegment">
                  <option value="All">All Users</option>
                  <option value="Active Users">Active Users</option>
                </select>
              </div>
              <button type="submit" class="btn btn-primary">
                <i class="fas fa-paper-plane"></i> Send Notification
              </button>
            </form>
          </div>
        </div>
      </div>
    `;

    const renderSettings = () => `
      <div class="tabs">
        <div class="tab active" onclick="switchSettingsTab('general', this)">General</div>
        <div class="tab" onclick="switchSettingsTab('onesignal', this)">OneSignal</div>
        <div class="tab" onclick="switchSettingsTab('uploads', this)">Uploads</div>
        <div class="tab" onclick="switchSettingsTab('features', this)">Features</div>
      </div>

      <div id="generalSettings" class="tab-content active">
        <div class="card">
          <div class="card-header">
            <h3>General Settings</h3>
            <button onclick="saveSettings()" class="btn btn-success btn-sm">
              <i class="fas fa-save"></i> Save
            </button>
          </div>
          <div class="card-body">
            <div class="settings-section">
              <h4>Application</h4>
              <div class="settings-group">
                <div class="setting-item">
                  <label>App Name</label>
                  <input type="text" id="setting_app_name" value="${escapeHtml(state.settings.app_name?.value || '')}">
                </div>
                <div class="setting-item">
                  <label>App Version</label>
                  <input type="text" id="setting_app_version" value="${escapeHtml(state.settings.app_version?.value || '')}">
                </div>
                <div class="setting-item">
                  <label>Support Email</label>
                  <input type="email" id="setting_support_email" value="${escapeHtml(state.settings.support_email?.value || '')}">
                </div>
              </div>
            </div>
            <div class="settings-section">
              <h4>Maintenance</h4>
              <div class="settings-group">
                <div class="setting-item">
                  <label>Maintenance Mode</label>
                  <label class="toggle">
                    <input type="checkbox" id="setting_maintenance_mode" ${state.settings.maintenance_mode?.value ? 'checked' : ''}>
                    <span class="toggle-slider"></span>
                  </label>
                  <div class="help-text">Show maintenance message to users</div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div id="onesignalSettings" class="tab-content">
        <div class="card">
          <div class="card-header">
            <h3>OneSignal Config</h3>
            <button onclick="saveSettings()" class="btn btn-success btn-sm">
              <i class="fas fa-save"></i> Save
            </button>
          </div>
          <div class="card-body">
            <div class="settings-section">
              <h4>Configuration</h4>
              <div class="settings-group">
                <div class="setting-item">
                  <label>Enable OneSignal</label>
                  <label class="toggle">
                    <input type="checkbox" id="setting_onesignal_enabled" ${state.settings.onesignal_enabled?.value ? 'checked' : ''}>
                    <span class="toggle-slider"></span>
                  </label>
                </div>
                <div class="setting-item">
                  <label>App ID</label>
                  <input type="text" id="setting_onesignal_app_id" value="${escapeHtml(state.settings.onesignal_app_id?.value || '')}" placeholder="OneSignal App ID">
                  <div class="help-text">Find in OneSignal Dashboard > Settings</div>
                </div>
                <div class="setting-item">
                  <label>REST API Key</label>
                  <input type="password" id="setting_onesignal_api_key" value="${escapeHtml(state.settings.onesignal_api_key?.value || '')}" placeholder="REST API Key">
                  <div class="help-text">Keep this secret!</div>
                </div>
              </div>
            </div>
            <button onclick="testOneSignal()" class="btn btn-info" style="margin-top:20px;">
              <i class="fas fa-plug"></i> Test Connection
            </button>
          </div>
        </div>
      </div>

      <div id="uploadsSettings" class="tab-content">
        <div class="card">
          <div class="card-header">
            <h3>Upload Settings</h3>
            <button onclick="saveSettings()" class="btn btn-success btn-sm">
              <i class="fas fa-save"></i> Save
            </button>
          </div>
          <div class="card-body">
            <div class="settings-section">
              <h4>File Size Limits</h4>
              <div class="settings-group">
                <div class="setting-item">
                  <label>Max Game Size (MB)</label>
                  <input type="number" id="setting_max_upload_size" value="${state.settings.max_upload_size?.value || 100}" min="1" max="500">
                  <div class="help-text">Maximum ZIP file size for games</div>
                </div>
                <div class="setting-item">
                  <label>Max Thumbnail (MB)</label>
                  <input type="number" id="setting_max_thumbnail_size" value="${state.settings.max_thumbnail_size?.value || 5}" min="1" max="20">
                  <div class="help-text">Maximum thumbnail size</div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div id="featuresSettings" class="tab-content">
        <div class="card">
          <div class="card-header">
            <h3>Feature Toggles</h3>
            <button onclick="saveSettings()" class="btn btn-success btn-sm">
              <i class="fas fa-save"></i> Save
            </button>
          </div>
          <div class="card-body">
            <div class="settings-group">
              <div class="setting-item">
                <label>User Registration</label>
                <label class="toggle">
                  <input type="checkbox" id="setting_registration_enabled" ${state.settings.registration_enabled?.value ? 'checked' : ''}>
                  <span class="toggle-slider"></span>
                </label>
                <div class="help-text">Allow new registrations</div>
              </div>
              <div class="setting-item">
                <label>Guest Play</label>
                <label class="toggle">
                  <input type="checkbox" id="setting_guest_play_enabled" ${state.settings.guest_play_enabled?.value ? 'checked' : ''}>
                  <span class="toggle-slider"></span>
                </label>
                <div class="help-text">Play without account</div>
              </div>
              <div class="setting-item">
                <label>Ratings</label>
                <label class="toggle">
                  <input type="checkbox" id="setting_ratings_enabled" ${state.settings.ratings_enabled?.value ? 'checked' : ''}>
                  <span class="toggle-slider"></span>
                </label>
                <div class="help-text">Enable game ratings</div>
              </div>
              <div class="setting-item">
                <label>Analytics</label>
                <label class="toggle">
                  <input type="checkbox" id="setting_analytics_enabled" ${state.settings.analytics_enabled?.value ? 'checked' : ''}>
                  <span class="toggle-slider"></span>
                </label>
                <div class="help-text">Track usage analytics</div>
              </div>
              <div class="setting-item">
                <label>Featured Count</label>
                <input type="number" id="setting_featured_games_count" value="${state.settings.featured_games_count?.value || 10}" min="1" max="50">
                <div class="help-text">Number of featured games</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    `;

    // ==================== EVENT HANDLERS ====================
    const handleLogin = async (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;

      if (!email || !password) {
        showToast('Please fill in all fields', 'error');
        return;
      }

      try {
        const data = await api('/auth/login', {
          method: 'POST',
          body: JSON.stringify({ email, password })
        });

        if (data.data.role !== 'admin') {
          showToast('Admin access required', 'error');
          return;
        }

        state.token = data.data.token;
        state.user = data.data;
        localStorage.setItem('adminToken', data.data.token);
        startAutoSync(); // Start auto-sync after login
        showToast('Login successful!', 'success');
        render();
      } catch (error) {
        showToast(error.message || 'Login failed', 'error');
      }
    };

    const handleLogout = () => {
      stopAutoSync();
      state.token = null;
      state.user = null;
      state.stats = null;
      state.users = [];
      state.games = [];
      state.notifications = [];
      state.settings = {};
      state.lastSync = null;
      localStorage.removeItem('adminToken');
      render();
    };

    const navigate = (page) => {
      state.currentPage = page;
      state.loading = true;
      render();
    };

    // ==================== DATA LOADING ====================
    const loadPageData = async () => {
      state.loading = true;

      try {
        switch (state.currentPage) {
          case 'dashboard': await loadStats(); break;
          case 'users': await loadUsers(); break;
          case 'games': await loadGames(); break;
          case 'notifications': await loadNotifications(); break;
          case 'settings': await loadSettings(); break;
        }
      } catch (error) {
        showToast(`Error loading ${state.currentPage}`, 'error');
      } finally {
        state.loading = false;
      }
    };

    const loadStats = async () => {
      const data = await api('/admin/stats');
      state.stats = data.data;
      render();
    };

    const loadUsers = async () => {
      const search = document.getElementById('userSearch')?.value || '';
      const data = await api(`/admin/users?search=${encodeURIComponent(search)}`);
      state.users = data.data || [];
      render();
    };

    const loadGames = async () => {
      const search = document.getElementById('gameSearch')?.value || '';
      const data = await api(`/admin/games?search=${encodeURIComponent(search)}`);
      state.games = data.data || [];
      render();
    };

    const loadNotifications = async () => {
      const data = await api('/admin/notifications');
      state.notifications = data.data || [];
      render();
    };

    const loadSettings = async () => {
      const data = await api('/admin/settings');
      state.settings = data.data || {};
      render();
    };

    // ==================== USER ACTIONS ====================
    const toggleUserStatus = async (id) => {
      try {
        await api(`/admin/users/${id}/toggle-active`, { method: 'PUT' });
        showToast('User status updated', 'success');
        loadUsers();
      } catch (error) {
        showToast(error.message, 'error');
      }
    };

    const changeUserRole = async (id, currentRole) => {
      const newRole = currentRole === 'admin' ? 'user' : 'admin';
      showConfirm(`Change role to ${newRole}?`, async () => {
        try {
          await api(`/admin/users/${id}/role`, {
            method: 'PUT',
            body: JSON.stringify({ role: newRole })
          });
          showToast('Role updated', 'success');
          loadUsers();
        } catch (error) {
          showToast(error.message, 'error');
        }
      });
    };

    const confirmDeleteUser = (id, username) => {
      showConfirm(`Delete user "${username}"? This cannot be undone.`, async () => {
        try {
          await api(`/admin/users/${id}`, { method: 'DELETE' });
          showToast('User deleted', 'success');
          loadUsers();
        } catch (error) {
          showToast(error.message, 'error');
        }
      });
    };

    // ==================== GAME ACTIONS ====================
    const toggleGameFeatured = async (id) => {
      try {
        await api(`/admin/games/${id}/toggle-featured`, { method: 'PUT' });
        showToast('Featured status updated', 'success');
        loadGames();
      } catch (error) {
        showToast(error.message, 'error');
      }
    };

    const toggleGameActive = async (id) => {
      try {
        await api(`/admin/games/${id}/toggle-active`, { method: 'PUT' });
        showToast('Game status updated', 'success');
        loadGames();
      } catch (error) {
        showToast(error.message, 'error');
      }
    };

    const confirmDeleteGame = (id, title) => {
      showConfirm(`Delete game "${title}"? This cannot be undone.`, async () => {
        try {
          await api(`/admin/games/${id}`, { method: 'DELETE' });
          showToast('Game deleted', 'success');
          loadGames();
        } catch (error) {
          showToast(error.message, 'error');
        }
      });
    };

    // ==================== NOTIFICATION ACTIONS ====================
    const confirmDeleteNotification = (id) => {
      showConfirm('Delete this notification?', async () => {
        try {
          await api(`/admin/notifications/${id}`, { method: 'DELETE' });
          showToast('Notification deleted', 'success');
          loadNotifications();
        } catch (error) {
          showToast(error.message, 'error');
        }
      });
    };

    // ==================== SETTINGS ACTIONS ====================
    const saveSettings = async () => {
      const settings = {};
      document.querySelectorAll('[id^="setting_"]').forEach(input => {
        const key = input.id.replace('setting_', '');
        settings[key] = input.type === 'checkbox' ? input.checked : input.value;
      });

      try {
        await api('/admin/settings', {
          method: 'PUT',
          body: JSON.stringify({ settings })
        });
        showToast('Settings saved', 'success');
        loadSettings();
      } catch (error) {
        showToast(error.message, 'error');
      }
    };

    const testOneSignal = async () => {
      try {
        const appId = document.getElementById('setting_onesignal_app_id').value;
        const apiKey = document.getElementById('setting_onesignal_api_key').value;

        if (!appId || !apiKey) {
          showToast('Please enter App ID and API Key', 'error');
          return;
        }

        const data = await api('/admin/test-onesignal', {
          method: 'POST',
          body: JSON.stringify({ appId, apiKey })
        });

        if (data.data && data.data.appName) {
          showToast(`Connected! App: ${data.data.appName}, Players: ${data.data.players || 0}`, 'success');
        } else {
          showToast('Connection successful!', 'success');
        }
      } catch (error) {
        showToast(error.message || 'Connection failed', 'error');
      }
    };

    const sendPushNotification = async (e) => {
      e.preventDefault();

      const title = document.getElementById('pushTitle').value.trim();
      const message = document.getElementById('pushMessage').value.trim();
      const segment = document.getElementById('pushSegment').value;

      if (!title || !message) {
        showToast('Please fill in all fields', 'error');
        return;
      }

      try {
        await api('/admin/push-notifications', {
          method: 'POST',
          body: JSON.stringify({ title, message, segment })
        });
        showToast('Push notification sent!', 'success');
        document.getElementById('pushTitle').value = '';
        document.getElementById('pushMessage').value = '';
      } catch (error) {
        showToast(error.message, 'error');
      }
    };

    // ==================== MODAL FUNCTIONS ====================
    const showGameModal = () => {
      const content = `
        <form id="gameForm" onsubmit="createGame(event)" enctype="multipart/form-data">
          <div class="form-group">
            <label>Game Title *</label>
            <input type="text" id="gameTitle" required placeholder="Enter game title">
          </div>
          <div class="form-group">
            <label>Description *</label>
            <textarea id="gameDescription" required placeholder="Game description" rows="3"></textarea>
          </div>
          <div class="form-group">
            <label>Category</label>
            <select id="gameCategory">
              <option value="action">Action</option>
              <option value="puzzle">Puzzle</option>
              <option value="arcade">Arcade</option>
              <option value="sports">Sports</option>
              <option value="racing">Racing</option>
              <option value="strategy">Strategy</option>
              <option value="casual" selected>Casual</option>
              <option value="adventure">Adventure</option>
            </select>
          </div>
          <div class="form-group">
            <label>Difficulty</label>
            <select id="gameDifficulty">
              <option value="easy">Easy</option>
              <option value="medium" selected>Medium</option>
              <option value="hard">Hard</option>
            </select>
          </div>
          <div class="form-group">
            <label>Tags (comma separated)</label>
            <input type="text" id="gameTags" placeholder="fun, multiplayer, classic">
          </div>
          <div class="form-group">
            <label>Controls</label>
            <textarea id="gameControls" placeholder="Arrow keys to move, Space to jump" rows="2"></textarea>
          </div>
          <div class="form-group">
            <label>Game File (ZIP) *</label>
            <div class="file-upload-area" onclick="document.getElementById('gameFile').click()">
              <i class="fas fa-file-archive"></i>
              <p id="gameFileName">Click to select ZIP file containing index.html</p>
            </div>
            <input type="file" id="gameFile" accept=".zip" style="display:none" onchange="handleFileSelect(this, 'gameFileName')">
          </div>
          <div class="form-group">
            <label>Thumbnail Image</label>
            <div class="file-upload-area" onclick="document.getElementById('gameThumbnail').click()">
              <i class="fas fa-image"></i>
              <p id="thumbnailFileName">Click to select thumbnail image</p>
            </div>
            <input type="file" id="gameThumbnail" accept="image/*" style="display:none" onchange="handleFileSelect(this, 'thumbnailFileName'); previewThumbnail(this)">
            <img id="thumbnailPreview" style="display:none; max-width:200px; margin-top:10px; border-radius:8px;">
          </div>
        </form>
      `;

      const footer = `
        <button class="btn btn-secondary btn-sm" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary btn-sm" onclick="document.getElementById('gameForm').requestSubmit()">
          <i class="fas fa-upload"></i> Upload Game
        </button>
      `;

      showModal('Upload New Game', content, footer);
    };

    const handleFileSelect = (input, labelId) => {
      const file = input.files[0];
      if (file) {
        // Validate file size based on type
        const isGameFile = input.id === 'gameFile';
        const maxSize = isGameFile ? 100 * 1024 * 1024 : 5 * 1024 * 1024; // 100MB for games, 5MB for thumbnails
        const maxSizeLabel = isGameFile ? '100MB' : '5MB';

        if (file.size > maxSize) {
          showToast(`File too large. Maximum: ${maxSizeLabel}`, 'error');
          input.value = '';
          return;
        }

        document.getElementById(labelId).textContent = file.name;
        // Find the file-upload-area div and add has-file class
        const uploadArea = input.previousElementSibling;
        if (uploadArea && uploadArea.classList.contains('file-upload-area')) {
          uploadArea.classList.add('has-file');
        }
      }
    };

    const previewThumbnail = (input) => {
      const file = input.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (e) => {
          const preview = document.getElementById('thumbnailPreview');
          preview.src = e.target.result;
          preview.style.display = 'block';
        };
        reader.readAsDataURL(file);
      }
    };

    const createGame = async (e) => {
      e.preventDefault();

      const title = document.getElementById('gameTitle').value.trim();
      const description = document.getElementById('gameDescription').value.trim();
      const gameFile = document.getElementById('gameFile').files[0];
      const thumbnail = document.getElementById('gameThumbnail').files[0];

      // Validate title
      if (!title || title.length < 3 || title.length > 100) {
        showToast('Title must be between 3-100 characters', 'error');
        return;
      }

      // Validate description
      if (!description || description.length < 10 || description.length > 500) {
        showToast('Description must be between 10-500 characters', 'error');
        return;
      }

      if (!gameFile) {
        showToast('Please select a game ZIP file', 'error');
        return;
      }

      // Validate file size (100MB max)
      const maxGameSize = 100 * 1024 * 1024;
      if (gameFile.size > maxGameSize) {
        showToast('Game file too large. Maximum: 100MB', 'error');
        return;
      }

      // Validate thumbnail size (5MB max)
      if (thumbnail && thumbnail.size > 5 * 1024 * 1024) {
        showToast('Thumbnail too large. Maximum: 5MB', 'error');
        return;
      }

      const formData = new FormData();
      formData.append('title', title);
      formData.append('description', description);
      formData.append('category', document.getElementById('gameCategory').value);
      formData.append('difficulty', document.getElementById('gameDifficulty').value);
      formData.append('controls', document.getElementById('gameControls').value.trim());

      // Parse tags as JSON array
      const tags = document.getElementById('gameTags').value
        .split(',')
        .map(t => t.trim())
        .filter(t => t);
      formData.append('tags', JSON.stringify(tags));

      formData.append('gameFile', gameFile);
      if (thumbnail) {
        formData.append('thumbnail', thumbnail);
      }

      try {
        const response = await fetch(`/api/admin/games`, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${state.token}`
          },
          body: formData
        });

        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.message || data.error || 'Failed to upload game');
        }

        showToast('Game uploaded successfully!', 'success');
        closeModal();
        loadGames();
      } catch (error) {
        showToast(error.message, 'error');
      }
    };

    const showNotificationModal = () => {
      const content = `
        <form id="notificationForm" onsubmit="createNotification(event)">
          <div class="form-group">
            <label>Title</label>
            <input type="text" id="notifTitle" required placeholder="Notification title">
          </div>
          <div class="form-group">
            <label>Message</label>
            <textarea id="notifMessage" required placeholder="Notification message" rows="3"></textarea>
          </div>
          <div class="form-group">
            <label>Type</label>
            <select id="notifType">
              <option value="info">Info</option>
              <option value="success">Success</option>
              <option value="warning">Warning</option>
              <option value="error">Error</option>
              <option value="promotion">Promotion</option>
            </select>
          </div>
          <div class="form-group">
            <label>Target Audience</label>
            <select id="notifAudience">
              <option value="all">All Users</option>
              <option value="users">Users Only</option>
              <option value="admins">Admins Only</option>
            </select>
          </div>
        </form>
      `;

      const footer = `
        <button class="btn btn-secondary btn-sm" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary btn-sm" onclick="document.getElementById('notificationForm').requestSubmit()">
          <i class="fas fa-plus"></i> Create
        </button>
      `;

      showModal('Create Notification', content, footer);
    };

    const createNotification = async (e) => {
      e.preventDefault();

      const notifData = {
        title: document.getElementById('notifTitle').value.trim(),
        message: document.getElementById('notifMessage').value.trim(),
        type: document.getElementById('notifType').value,
        target_audience: document.getElementById('notifAudience').value
      };

      try {
        await api('/admin/notifications', {
          method: 'POST',
          body: JSON.stringify(notifData)
        });
        showToast('Notification created!', 'success');
        closeModal();
        loadNotifications();
      } catch (error) {
        showToast(error.message, 'error');
      }
    };

    const showSetup = async () => {
      const content = `
        <form id="setupForm" onsubmit="handleSetup(event)">
          <div class="form-group">
            <label>Admin Username</label>
            <input type="text" id="setupUsername" required placeholder="admin" minlength="3">
          </div>
          <div class="form-group">
            <label>Admin Email</label>
            <input type="email" id="setupEmail" required placeholder="admin@example.com">
          </div>
          <div class="form-group">
            <label>Admin Password</label>
            <input type="password" id="setupPassword" required placeholder="Strong password" minlength="6">
          </div>
        </form>
      `;

      const footer = `
        <button class="btn btn-secondary btn-sm" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary btn-sm" onclick="document.getElementById('setupForm').requestSubmit()">
          <i class="fas fa-user-plus"></i> Create Admin
        </button>
      `;

      showModal('First Time Setup', content, footer);
    };

    const handleSetup = async (e) => {
      e.preventDefault();

      const username = document.getElementById('setupUsername').value.trim();
      const email = document.getElementById('setupEmail').value.trim();
      const password = document.getElementById('setupPassword').value;

      try {
        await api('/admin/setup', {
          method: 'POST',
          body: JSON.stringify({ username, email, password })
        });
        showToast('Admin created! You can now login.', 'success');
        closeModal();
      } catch (error) {
        showToast(error.message, 'error');
      }
    };

    // ==================== TAB SWITCHING ====================
    const switchNotificationTab = (tab, el) => {
      document.querySelectorAll('#app .tabs .tab').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
      document.getElementById('inappNotifications').classList.toggle('active', tab === 'inapp');
      document.getElementById('pushNotifications').classList.toggle('active', tab === 'push');
    };

    const switchSettingsTab = (tab, el) => {
      document.querySelectorAll('#app .tabs .tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
      document.getElementById(tab + 'Settings').classList.add('active');
    };

    // ==================== UTILITIES ====================
    const debounce = (fn, delay) => {
      let timeout;
      return (...args) => {
        clearTimeout(timeout);
        timeout = setTimeout(() => fn(...args), delay);
      };
    };

    const debouncedLoadUsers = debounce(loadUsers, 500);
    const debouncedLoadGames = debounce(loadGames, 500);

    // ==================== INITIALIZATION ====================
    const init = async () => {
      if (state.token) {
        try {
          const data = await api('/auth/me');
          if (!data.data || data.data.role !== 'admin') {
            handleLogout();
            showToast('Admin access required', 'error');
            return;
          }
          state.user = data.data;
          startAutoSync(); // Start auto-sync after successful auth
        } catch (error) {
          handleLogout();
        }
      }
      render();
    };

    // Start the app
    init();

    // Cleanup on page unload
    window.addEventListener('beforeunload', stopAutoSync);
  </script>
</body>
</html>
